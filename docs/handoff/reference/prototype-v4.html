<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>نظام مراقبة جودة الخدمة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating sidebar on the start (right) edge + sticky glass top bar; content flows in a 12-col grid of quiet cards.
   Signature: the "threshold scale" — every KPI is drawn against its approved limits like an engineering gauge. */
:root{
  --bg:#F2F5F7; --bg-2:#E9EEF1; --surface:#FFFFFF; --surface-2:#F7F9FA; --glass:rgba(242,245,247,.78);
  --fg:#14212A; --fg-2:#4E5C66; --fg-3:#68757F; --line:#E0E6EA; --line-2:#CFD8DE;
  --accent:#1B6CA8; --accent-fg:#FFFFFF; --accent-soft:#E5EFF7; --accent-ink:#155585;
  --teal:#1A7F7A; --teal-soft:#E1F2F0;
  --ok:#2B7A4B; --ok-soft:#E6F3EB; --warn:#A35607; --warn-soft:#FBEFDF; --crit:#B8322B; --crit-soft:#FBE8E6;
  --na:#5F6B75; --na-soft:#ECEFF2; --nl:#4558AC; --nl-soft:#EAEDF9;
  --s1:#1B6CA8; --s2:#1A8F88; --s3:#7A5BB5;
  --shadow:0 1px 2px rgba(16,34,46,.05),0 6px 20px rgba(16,34,46,.05);
  --shadow-lg:0 10px 40px rgba(16,34,46,.16);
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-xl:20px; --r-lg:16px; --r-md:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1317; --bg-2:#121A1F; --surface:#161F25; --surface-2:#1B252C; --glass:rgba(13,19,23,.78);
  --fg:#E5ECF0; --fg-2:#A7B4BD; --fg-3:#8C99A3; --line:#25313A; --line-2:#33414B;
  --accent:#5EAAE4; --accent-fg:#06131C; --accent-soft:#14303F; --accent-ink:#8CC3EE;
  --teal:#4FC1B9; --teal-soft:#123331;
  --ok:#62C690; --ok-soft:#132E20; --warn:#F0A650; --warn-soft:#382611; --crit:#F27E75; --crit-soft:#3B1916;
  --na:#9DA9B2; --na-soft:#222C33; --nl:#94A5F2; --nl-soft:#1C2343;
  --s1:#5EAAE4; --s2:#4FC1B9; --s3:#B79FEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1317; --bg-2:#121A1F; --surface:#161F25; --surface-2:#1B252C; --glass:rgba(13,19,23,.78);
  --fg:#E5ECF0; --fg-2:#A7B4BD; --fg-3:#8C99A3; --line:#25313A; --line-2:#33414B;
  --accent:#5EAAE4; --accent-fg:#06131C; --accent-soft:#14303F; --accent-ink:#8CC3EE;
  --teal:#4FC1B9; --teal-soft:#123331;
  --ok:#62C690; --ok-soft:#132E20; --warn:#F0A650; --warn-soft:#382611; --crit:#F27E75; --crit-soft:#3B1916;
  --na:#9DA9B2; --na-soft:#222C33; --nl:#94A5F2; --nl-soft:#1C2343;
  --s1:#5EAAE4; --s2:#4FC1B9; --s3:#B79FEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:0}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.u{color:var(--fg-2);font-size:.88em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:20px;padding-block:16px;min-height:100vh}
.sidebar{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);
  display:flex;flex-direction:column;padding:18px 12px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{display:block;font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:.02em}
.brand small{display:block;color:var(--fg-2);font-size:12px;line-height:1.4}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.nav-group{padding:10px 0 4px}
.nav-label{font-size:12px;color:var(--fg-3);padding:0 10px 4px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:start;padding:8px 10px;border-radius:10px;color:var(--fg);font-size:14.5px;min-height:38px}
.nav-item .ic{color:var(--fg-2)}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item.on .ic{color:var(--accent)}
.nav-item .badge{margin-inline-start:auto;background:var(--crit);color:#fff;font-size:11.5px;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.side-foot{margin-top:auto;padding-top:12px;display:grid;gap:10px}
.method-mini{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--fg-2);line-height:1.7}
.method-mini b{color:var(--fg);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 4px;margin-bottom:6px;background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}
.topbar .grow{flex:1}
.ctx{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;min-height:40px}
.ctx label{font-size:12.5px;color:var(--fg-3);white-space:nowrap;padding-inline-start:4px}
.ctx select{border:0;background:transparent;font-weight:500;font-size:14px;padding:4px 2px;max-width:220px;min-height:32px}
.ctx select:focus-visible{outline-offset:0}
.user{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;min-height:40px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:600;font-size:13px}
.user .who{line-height:1.25;font-size:13.5px}.user .who small{display:block;color:var(--fg-3);font-size:11.5px}
.icon-btn.menu-btn{display:none}
.demo-strip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--nl);background:var(--nl-soft);border-radius:10px;padding:6px 12px;margin-bottom:14px}
.demo-strip b{font-weight:600}

.page{display:flex;flex-direction:column;gap:20px;padding-bottom:40px;animation:pagein .28s ease both}
@keyframes pagein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph .t{flex:1;min-width:220px}
.eyebrow{font-size:12.5px;color:var(--fg-3);font-weight:500;letter-spacing:.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.h1{font-size:28px;font-weight:700;letter-spacing:-.005em}
.lead{color:var(--fg-2);font-size:14.5px;margin-top:2px;max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:4px}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:16.5px;font-weight:600}
.card-h .desc{font-size:13px;color:var(--fg-2);margin-top:2px}
.card-h .end{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid transparent;padding:0 16px;min-height:40px;font-size:14.5px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.tinted{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.lg{min-height:48px;padding:0 22px;font-size:15.5px;border-radius:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--bg)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px 2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.7}
.pill .ic{width:14px;height:14px;stroke-width:2.1}
.s-ok{color:var(--ok);background:var(--ok-soft)}
.s-warn{color:var(--warn);background:var(--warn-soft)}
.s-crit{color:var(--crit);background:var(--crit-soft)}
.s-na{color:var(--na);background:var(--na-soft)}
.s-nolimit{color:var(--nl);background:var(--nl-soft)}
.s-info{color:var(--accent-ink);background:var(--accent-soft)}
.s-teal{color:var(--teal);background:var(--teal-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border-radius:6px;padding:1px 7px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap;line-height:1.7}
.tag.demo{border-color:transparent;background:var(--nl-soft);color:var(--nl)}
.tag.rec{border-style:solid}
.tag.calc{border-color:transparent;background:var(--teal-soft);color:var(--teal)}
.tag.inf{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.code{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--fg-2);background:var(--bg);border-radius:6px;padding:1px 7px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:500;color:var(--fg)}
.field .hint{font-size:12.5px;color:var(--fg-3)}
.field .err{font-size:12.5px;color:var(--crit);display:flex;gap:5px;align-items:center}
.req{color:var(--crit);margin-inline-start:2px}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:11px;padding:0 12px;min-height:44px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.textarea{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.6}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input.bad{border-color:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 15%,transparent)}
.input.ltr{direction:ltr;text-align:right}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .input{padding-inline-start:40px}
[dir=rtl] .input-wrap .input.ltr{padding-right:40px;padding-left:12px}
[dir=rtl] .input-wrap .input.ltr:has(+ .suffix){padding-left:48px}
[dir=ltr] .input-wrap .input:has(+ .suffix){padding-right:48px}
.input-wrap>.ic{position:absolute;inset-inline-start:13px;color:var(--fg-3);pointer-events:none}
.input-wrap .suffix{position:absolute;inset-inline-end:8px}
.input-unit{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.input-unit:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input-unit.bad{border-color:var(--crit)}
.input-unit input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;min-height:44px;font-size:16px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.input-unit input:focus{outline:none}
.input-unit .unit{display:flex;align-items:center;padding:0 12px;color:var(--fg-2);font-size:13px;background:var(--surface-2);border-inline-start:1px solid var(--line);white-space:nowrap}
.input-unit select{border:0;border-inline-start:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fgrid .full{grid-column:1/-1}

.seg{display:inline-flex;background:var(--bg-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 12px;font-size:13.5px;font-weight:500;color:var(--fg-2);min-height:32px;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:hover:not(.on){color:var(--fg)}

.switch{position:relative;width:46px;height:28px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{inset-inline-start:21px}
.switch input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+span{opacity:.5}

.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}

.callout{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.7}
.callout .ic{margin-top:3px}
.callout.info{background:var(--accent-soft);color:var(--fg)}.callout.info>.ic{color:var(--accent)}
.callout.warn{background:var(--warn-soft)}.callout.warn>.ic{color:var(--warn)}
.callout.crit{background:var(--crit-soft)}.callout.crit>.ic{color:var(--crit)}
.callout.nl{background:var(--nl-soft)}.callout.nl>.ic{color:var(--nl)}
.callout.na{background:var(--na-soft)}.callout.na>.ic{color:var(--na)}
.callout .body{flex:1;min-width:0}
.callout .body b{font-weight:600}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 16px;color:var(--fg-2)}
.empty .em-ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;color:var(--fg-3);margin-bottom:4px}
.empty h3{color:var(--fg);font-size:16px}
.empty p{max-width:52ch;font-size:14px}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{font-size:12.5px;font-weight:500;color:var(--fg-3);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer;transition:background .12s}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .kname{font-weight:500}
.tbl .kname small{display:block;color:var(--fg-3);font-weight:400;font-size:12.5px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.stat .top{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13px;font-weight:500}
.stat .sic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.stat .sic .ic{width:16px;height:16px}
.stat .val{font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .val small{font-size:15px;color:var(--fg-3);font-weight:500;margin-inline-start:4px}
.stat .foot{font-size:12.5px;color:var(--fg-3)}

/* Threshold scale — signature */
.scale{position:relative;padding-top:6px;min-width:150px}
.scale .track{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.scale .z{display:block;height:100%}
.z-ok{background:color-mix(in srgb,var(--ok) 32%,transparent)}
.z-warn{background:color-mix(in srgb,var(--warn) 34%,transparent)}
.z-crit{background:color-mix(in srgb,var(--crit) 32%,transparent)}
.scale .mk{position:absolute;top:0;width:4px;height:20px;border-radius:3px;transform:translateX(50%);box-shadow:0 0 0 2px var(--surface)}
.mk.s-ok{background:var(--ok)}.mk.s-warn{background:var(--warn)}.mk.s-crit{background:var(--crit)}.mk.s-na{background:var(--na)}
.scale .ticks{position:relative;height:18px;margin-top:4px;font-size:11px;color:var(--fg-3)}
.scale .ticks span{position:absolute;transform:translateX(50%);white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.scale.none{font-size:12.5px;color:var(--nl);padding:0}
.scale.lg .track{height:12px}.scale.lg .mk{height:26px;width:5px}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
.flow{direction:ltr}
.still .page,#ov.still .overlay,#ov.still .sheet,#ov.still .drawer{animation:none}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.chart .axn{fill:var(--fg-3);font-size:11px;font-family:var(--mono)}
.chart .thr{stroke-width:1.4;stroke-dasharray:5 4}
.chart .thl{font-size:11px;font-weight:600;font-family:var(--font)}
.chart .guide{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent;cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend .dash{width:16px;height:0;border-top:2px dashed;border-radius:0;vertical-align:3px}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:140px;display:none}
.tip b{display:block;font-size:12.5px;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.chart-head{font-size:14px;color:var(--fg-2);margin:-6px 0 10px;line-height:1.6}
.chart-head b{color:var(--fg);font-weight:600}

.dist{display:flex;flex-direction:column;gap:14px}
.dist-row .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;gap:8px}
.dist-row .bar{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;background:var(--bg)}
.dist-row .bar span{display:block;height:100%}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-crit{background:var(--crit)}.b-na{background:var(--na);opacity:.55}.b-nolimit{background:var(--nl);opacity:.7}

/* Lists */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.click{cursor:pointer;border-radius:10px;padding-inline:8px;margin-inline:-8px}
.lrow.click:hover{background:var(--surface-2)}
.lrow .lic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--fg-2)}
.lrow .lmain{flex:1;min-width:0}
.lrow .lmain b{font-weight:600;font-size:14.5px;display:block}
.lrow .lmain small{color:var(--fg-3);font-size:12.5px}
.lrow .chev{color:var(--fg-3)}

/* Phase strip */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;counter-reset:ph}
.phase{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:start;min-width:0}
button.phase{cursor:pointer}button.phase:hover{border-color:var(--accent)}
.phase .pn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;background:var(--bg-2);color:var(--fg-2);font-family:var(--mono)}
.phase b{display:block;font-size:13.5px;font-weight:600}
.phase small{display:block;font-size:12px;color:var(--fg-3);line-height:1.5}
.phase.cur{border-color:var(--accent);background:var(--accent-soft)}
.phase.cur .pn{background:var(--accent);color:var(--accent-fg)}
.phase.done .pn{background:var(--ok);color:#fff}

/* Wizard */
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg-3);font-weight:500;background:none;border:0;padding:4px 6px;border-radius:9px}
.step .sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12.5px;font-family:var(--mono)}
.step.cur{color:var(--fg)}.step.cur .sn{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.step.done{color:var(--fg-2)}.step.done .sn{border-color:var(--ok);background:var(--ok);color:#fff}
.step-sep{width:28px;height:1.5px;background:var(--line-2)}
.wiz-foot{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.wiz-foot .grow{flex:1;font-size:13px;color:var(--fg-2);min-width:120px}
.progress{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.kcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kcard.bad{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.kcard .kh{display:flex;gap:10px;align-items:flex-start}
.kcard .kh h3{font-size:15.5px;font-weight:600}
.kcard .kh p{font-size:12.5px;color:var(--fg-3)}
.kcard .kh .end{margin-inline-start:auto}
.computed{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;border-radius:10px;background:var(--surface-2);padding:8px 12px;border:1px dashed var(--line-2)}
.computed b{font-size:16px;font-weight:600}
.computed .f{color:var(--fg-3);font-size:12px;flex-basis:100%}
.pick{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.pick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.pick.off{opacity:.65;cursor:default}
.pick input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px;flex:none}

/* Factors / actions */
.fcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.fcard .fh{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer;width:100%;border:0;background:none;text-align:start}
.fcard .fh:hover{background:var(--surface-2)}
.fcard .fh h3{font-size:15px;font-weight:600}
.fcard .fh p{font-size:13px;color:var(--fg-2);margin-top:2px}
.fcard .fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.fstate{border-inline-start:4px solid transparent}
.fstate.confirmed{border-inline-start-color:var(--accent)}
.fstate.possible{border-inline-start-color:var(--teal)}
.fstate.verify{border-inline-start-color:var(--nl)}
.fstate.excluded{border-inline-start-color:var(--na)}
.fs-confirmed{color:var(--accent-ink);background:var(--accent-soft)}
.fs-possible{color:var(--teal);background:var(--teal-soft)}
.fs-verify{color:var(--nl);background:var(--nl-soft)}
.fs-excluded{color:var(--na);background:var(--na-soft)}
.fs-unassessed{color:var(--fg-3);background:var(--bg)}
.evid{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.evid li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.evid li .ic{color:var(--fg-3);margin-top:3px}
.rii{display:flex;align-items:center;gap:8px;min-width:140px}
.rii .bar{flex:1;height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.rii .bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.life{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-3);flex-wrap:wrap}
.life .st{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line-2)}
.life .st.on{border-color:transparent;font-weight:600}
.life .st.on.a{background:var(--na-soft);color:var(--fg)}
.life .st.on.b{background:var(--accent-soft);color:var(--accent-ink)}
.life .st.on.c{background:var(--ok-soft);color:var(--ok)}
.life .ln{width:14px;height:1.5px;background:var(--line-2)}

.side-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.sticky-aside{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--fg-3)}.kv dd{margin:0;font-weight:500;min-width:0}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kvs>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kvs small{display:block;font-size:12px;color:var(--fg-3)}
.kvs b{font-size:15px;font-weight:600}

.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--bg-2)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}

/* Station cards */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.scard{display:flex;flex-direction:column;gap:14px}
.scard .sh{display:flex;gap:12px;align-items:flex-start}
.scard .sh h3{font-size:16px;font-weight:600}
.cap{display:flex;flex-direction:column;gap:6px}
.cap .bar{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.cap .bar i{display:block;height:100%;background:var(--s2);border-radius:99px}
.cap .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-2);gap:8px}
.scard .foot{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.newflash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}

/* KPI list */
.klist{display:flex;flex-direction:column}
.kitem{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.kitem:last-child{border-bottom:0}
.kitem h3{font-size:15.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kitem p{font-size:13px;color:var(--fg-2);margin-top:3px}
.kmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kitem .lims{font-size:12.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:6px}
.kitem .ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipf{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--fg-2);display:inline-flex;gap:6px;align-items:center;min-height:34px}
.chipf.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chipf .cnt{font-family:var(--mono);font-size:11.5px;opacity:.75}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(10,20,28,.38);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(18px);opacity:.6}}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.sheet-h h2{font-size:19px;font-weight:600}
.sheet-h p{font-size:13.5px;color:var(--fg-2);margin-top:2px}
.sheet-h .icon-btn{margin-inline-start:auto;background:var(--bg)}
.sheet-b{padding:6px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.grabber{display:none;width:38px;height:5px;border-radius:9px;background:var(--line-2);margin:8px auto 0}
.drawer-ov{justify-content:flex-end;padding:0}
.drawer{background:var(--surface);height:100%;width:min(560px,100%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .26s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(-30px);opacity:.5}}
.drawer .sheet-b{flex:1}

.toast{position:fixed;z-index:100;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px);animation:rise .25s ease}
.processing{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:24px}
.proc-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.proc-card li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--fg-3)}
.proc-card li.done{color:var(--fg)}.proc-card li.done .ic{color:var(--ok)}
.proc-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Tab bar (compact) */
.tabbar{display:none}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;padding-block:16px}
.login-form{display:flex;flex-direction:column;justify-content:center;padding:32px clamp(8px,5vw,72px)}
.login-form .inner{width:min(400px,100%);display:flex;flex-direction:column;gap:22px}
.login-art{border-radius:28px;background:linear-gradient(160deg,var(--accent-soft),color-mix(in srgb,var(--teal-soft) 70%,var(--surface)));border:1px solid var(--line);padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;overflow:hidden;min-width:0}
.login-art h2{font-size:clamp(22px,2.4vw,30px);font-weight:700;max-width:22ch;line-height:1.4}
.login-art p{color:var(--fg-2);max-width:48ch;margin-top:8px}
.flow{width:100%;height:auto}
.flow .pipe{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 7;animation:flowa 1.6s linear infinite}
@keyframes flowa{to{stroke-dashoffset:-26}}
.flow .node{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.flow .lab{fill:var(--fg);font-size:13px;font-family:var(--font);font-weight:500}
.flow .sublab{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.flow .nic{stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.triad{display:flex;gap:8px;flex-wrap:wrap}
.triad span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.triad .code{background:var(--accent-soft);color:var(--accent-ink)}
.demo-cred{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--fg-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Report paper */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:clamp(20px,4vw,48px);max-width:900px;margin:0 auto;width:100%;font-size:14px}
.paper .rhead{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid var(--fg);padding-bottom:14px;margin-bottom:8px;flex-wrap:wrap}
.paper .rhead h1{font-size:21px;font-weight:700}
.paper .rhead .meta{margin-inline-start:auto;font-size:12.5px;color:var(--fg-2);text-align:end;line-height:1.8}
.paper section{padding:16px 0;border-bottom:1px solid var(--line)}
.paper section:last-of-type{border-bottom:0}
.paper h2{font-size:15.5px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.paper h2 .sn{font-family:var(--mono);color:var(--accent);font-weight:500;font-size:13px}
.paper .tbl th{background:var(--surface-2)}
.paper .tbl td,.paper .tbl th{padding:8px 10px;border:1px solid var(--line)}
.paper .tbl{border-collapse:collapse}
.paper p+p{margin-top:8px}
.paper ul{margin:0;padding-inline-start:20px}
.paper .watermark{font-size:12px;color:var(--nl);background:var(--nl-soft);border-radius:8px;padding:6px 10px;margin:10px 0 0}
.sign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px;font-size:13px;color:var(--fg-2)}
.sign div{border-top:1px solid var(--line-2);padding-top:8px}

.audit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.audit li{display:flex;gap:12px;padding:8px 0;font-size:13.5px;position:relative}
.audit li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.audit li .when{color:var(--fg-3);font-size:12.5px;white-space:nowrap}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 6}
  .side-layout{grid-template-columns:minmax(0,1fr)}
  .sticky-aside{position:static}
}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sidebar{display:none}
  .sidebar.open{display:flex;position:fixed;z-index:85;top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline-start:10px;height:auto;width:min(290px,calc(100vw - 20px));box-shadow:var(--shadow-lg)}
  .nav-scrim{position:fixed;inset:0;z-index:84;background:rgba(10,20,28,.35)}
  .icon-btn.menu-btn{display:grid}
  .tabbar{display:flex;position:fixed;z-index:40;left:0;right:0;bottom:0;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    background:var(--glass);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line);justify-content:space-around}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--fg-3);padding:4px 2px;min-height:48px;position:relative}
  .tabbar button .ic{width:22px;height:22px}
  .tabbar button.on{color:var(--accent)}
  .tabbar .dot{position:absolute;top:2px;inset-inline-end:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--crit)}
  .user .who{display:none}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{order:-1}
  .kitem{grid-template-columns:minmax(0,1fr)}
  .kitem .ctl{flex-direction:row;align-items:center;justify-content:space-between}
}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c6{grid-column:span 12}
  .kcards,.fgrid{grid-template-columns:minmax(0,1fr)}
  .phases{grid-template-columns:minmax(0,1fr)}
  .h1{font-size:23px}
  .ctx label{display:none}
  .user{display:none}
  .ctx select{max-width:130px}
  .step .sl{display:none}.step.cur .sl{display:inline}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;width:100%;max-height:92vh}
  .grabber{display:block}
  .drawer-ov{align-items:stretch}
  .tbl.stackable thead{display:none}
  .tbl.stackable,.tbl.stackable tbody,.tbl.stackable tr,.tbl.stackable td{display:block;width:100%}
  .tbl.stackable tr{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px}
  .tbl.stackable td{border:0;padding:6px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .tbl.stackable td::before{content:attr(data-l);color:var(--fg-3);font-size:12.5px;flex:none}
  .tbl.stackable tr.grp-row{border:0;padding:0;margin:14px 0 6px}
  .tbl.stackable tr.grp-row td{border-radius:8px}
  .tbl.stackable tr.grp-row td::before{display:none}
  .tbl.stackable td.full{display:block}.tbl.stackable td.full::before{display:block;margin-bottom:4px}
  .tbl-wrap{margin:0;padding:0}
  .sign{grid-template-columns:minmax(0,1fr)}
}

ts and pumps, causing inconsistent practices and performance between shifts."}, "corr": [["A-10", 0.567, 50.42, 1], ["A-36", 0.491, 42.79, 2], ["A-06", 0.395, 30.75, 3], ["A-08", 0.361, 29.4, 4]]}, {"id": "O-36", "ax": 2, "imp": 3, "name": {"ar": "تأجيل أعمال الصيانة الوقائية والتصحيحية بسبب استمرار تشغيل المحطة وعدم توفر فترات توقف مخططة للمعدات والوحدات.", "en": "Preventive and corrective maintenance postponed because the plant runs continuously and no planned downtime is available for equipment and units."}, "corr": [["A-41", 0.397, 31.48, 1]]}, {"id": "O-37", "ax": 3, "imp": 1, "name": {"ar": "ضعف التنسيق وتبادل المعلومات بين إدارة المحطة والجهات الساندة، بما في ذلك المختبرات والصيانة والمخازن والدوائر الإدارية، مما يؤدي إلى تأخر معالجة المشكلات التشغيلية وتنفيذ الإجراءات التصحيحية.", "en": "Weak coordination and information sharing between plant management and supporting units (labs, maintenance, stores and administrative departments), delaying the handling of operational problems and corrective actions."}, "corr": [["A-19", 0.299, 23.28, 1], ["A-44", 0.274, 21.73, 2], ["A-62", 0.265, 20.92, 3], ["A-16", 0.267, 20.69, 4]]}, {"id": "O-38", "ax": 4, "imp": 2, "name": {"ar": "تأخر إطلاق التخصيصات المالية خلال السنة المالية، مما يؤدي إلى تأجيل شراء المواد الكيميائية وقطع الغيار والمستلزمات التشغيلية الضرورية.", "en": "Late release of financial allocations during the fiscal year, postponing purchases of chemicals, spare parts and essential operating supplies."}, "corr": [["A-21", 0.491, 43.31, 1], ["A-50", 0.465, 40.19, 2], ["A-20", 0.446, 39.66, 3], ["A-47", 0.432, 38.42, 4], ["A-22", 0.398, 34.83, 5], ["A-49", 0.364, 29.25, 6], ["A-23", 0.343, 28.66, 7], ["A-63", 0.337, 28.41, 8], ["A-48", 0.273, 23.3, 9]]}, {"id": "O-39", "ax": 5, "imp": null, "name": {"ar": "الاعتماد على الخبرة المتراكمة لعدد محدود من العاملين دون توثيقها أو نقلها بصورة منظمة إلى بقية الملاكات، مما يهدد استمرارية المعرفة التشغيلية.", "en": "Reliance on the accumulated experience of a few staff members without documenting it or passing it on systematically, threatening continuity of operating knowledge."}, "corr": null}, {"id": "O-40", "ax": 6, "imp": 4, "name": {"ar": "عدم إجراء مراجعة دورية لمؤشرات الأداء التشغيلية للمحطة، مما يؤدي إلى استمرار انخفاض الأداء أو تكرار الانحرافات دون اكتشافها ومعالجتها في الوقت المناسب.", "en": "No periodic review of the plant’s operational performance indicators, so low performance or repeated deviations continue without being detected and treated in time."}, "corr": [["A-57", 0.629, 45.6, 1], ["A-56", 0.587, 42.56, 2], ["A-33", 0.529, 41.19, 3], ["A-31", 0.481, 38.99, 4], ["A-58", 0.512, 37.67, 5], ["A-30", 0.458, 36.48, 6], ["A-32", 0.472, 35.57, 7], ["A-65", 0.445, 33.38, 8], ["A-29", 0.415, 32.76, 9]]}];
const ACTIONS = [{"id": "A-01", "ax": 0, "rii": 0.7857, "name": {"ar": "تركيب أجهزة المراقبة المستمرة للمعايير الحرجة في عمليات المعالجة، ومعايرتها وصيانتها بصورة دورية.", "en": "Install continuous monitoring devices for critical treatment parameters, and calibrate and maintain them regularly."}}, {"id": "A-02", "ax": 0, "rii": 0.8464, "name": {"ar": "تطوير وحدات المعالجة أو إعادة تحديد سعاتها بما يستوعب السعة الهيدروليكية المطلوبة والتغير في الطلب على المياه.", "en": "Upgrade treatment units or re-size them to handle the required hydraulic capacity and changing water demand."}}, {"id": "A-03", "ax": 0, "rii": 0.8893, "name": {"ar": "تحسين أداء الترشيح من خلال اعتماد عمق مناسب لوسائط الترشيح، وتحسين عمليات الغسل العكسي، وتعزيز السيطرة التشغيلية.", "en": "Improve filtration through suitable filter-media depth, better backwashing and stronger operational control."}}, {"id": "A-04", "ax": 0, "rii": 0.875, "name": {"ar": "تحسين عملية التعقيم وضمان فاعليتها من خلال مراقبة الكلور المتبقي وتوفير زمن تماس مناسب.", "en": "Improve disinfection and ensure its effectiveness by monitoring residual chlorine and providing adequate contact time."}}, {"id": "A-05", "ax": 0, "rii": 0.85, "name": {"ar": "توفير مضخات جرعات كيميائية عاملة واحتياطية مع التحويل التلقائي بينهما، وضبط الجرعات وفق معدل التدفق وظروف جودة المياه.", "en": "Provide duty and standby chemical dosing pumps with automatic changeover, and adjust doses to flow rate and water-quality conditions."}}, {"id": "A-06", "ax": 1, "rii": 0.7786, "name": {"ar": "إجراء اختبارات (Jar) بصورة روتينية لتحسين جرعات مواد التخثير وفق التغيرات في خصائص المياه الخام.", "en": "Run jar tests routinely to optimise coagulant doses as raw-water characteristics change."}}, {"id": "A-07", "ax": 1, "rii": 0.8143, "name": {"ar": "اعتماد المراقبة التشغيلية المستمرة للتحقق من فاعلية إجراءات السيطرة وتمكين اتخاذ الإجراءات التصحيحية في الوقت المناسب.", "en": "Adopt continuous operational monitoring to verify control measures and enable timely corrective action."}}, {"id": "A-08", "ax": 1, "rii": 0.8143, "name": {"ar": "إجراء التحقق والمعايرة الدورية لأنظمة الجرعات الكيميائية لضمان دقة معدلات التغذية الكيميائية.", "en": "Verify and calibrate chemical dosing systems regularly to ensure accurate feed rates."}}, {"id": "A-09", "ax": 1, "rii": 0.7607, "name": {"ar": "تطبيق خطط للمراقبة التشغيلية تحدد المعايير والمواقع والتكرارات والمسؤوليات والحدود المقبولة والإجراءات التصحيحية.", "en": "Apply operational monitoring plans that define parameters, locations, frequencies, responsibilities, acceptable limits and corrective actions."}}, {"id": "A-10", "ax": 1, "rii": 0.8893, "name": {"ar": "تعديل الجرعات الكيميائية وعمليات الغسل العكسي، مع تطبيق إجراءات استجابة محددة مسبقًا أثناء ظروف المياه الخام والمعالجة غير الطبيعية.", "en": "Adjust chemical doses and backwashing, applying predefined response procedures during abnormal raw-water and treatment conditions."}}, {"id": "A-11", "ax": 2, "rii": 0.8214, "name": {"ar": "تطبيق برامج للصيانة الوقائية لوحدات المعالجة والمعدات.", "en": "Apply preventive maintenance programmes for treatment units and equipment."}}, {"id": "A-12", "ax": 2, "rii": 0.7679, "name": {"ar": "حفظ سجلات الصيانة الوقائية ومراجعة أداء المعدات بصورة منتظمة.", "en": "Keep preventive maintenance records and review equipment performance regularly."}}, {"id": "A-13", "ax": 2, "rii": 0.8536, "name": {"ar": "استبدال أو إعادة تأهيل المعدات ومكونات المعالجة المتدهورة عند إظهار مؤشرات الصيانة انخفاضًا في الأداء.", "en": "Replace or rehabilitate degraded equipment and treatment components when maintenance indicators show declining performance."}}, {"id": "A-14", "ax": 2, "rii": 0.8857, "name": {"ar": "ضمان توفر قطع الغيار الحرجة ومواد الصيانة للحد من مدة توقف المعدات.", "en": "Ensure critical spare parts and maintenance materials are available to limit equipment downtime."}}, {"id": "A-15", "ax": 3, "rii": 0.8107, "name": {"ar": "التحديد الرسمي للأدوار والمسؤوليات والمساءلة، وتعميمها بين وظائف إدارة المحطة والإشراف والتشغيل والصيانة.", "en": "Formally define roles, responsibilities and accountability, and communicate them across plant management, supervision, operation and maintenance."}}, {"id": "A-16", "ax": 3, "rii": 0.775, "name": {"ar": "إضفاء الطابع المؤسسي على التقارير الإدارية الدورية، وتخطيط الموارد، وإعداد الموازنات، ومتابعة المشتريات وسلسلة التجهيز، ومراقبة التنفيذ.", "en": "Institutionalise periodic management reports, resource planning, budgeting, procurement and supply-chain follow-up, and implementation monitoring."}}, {"id": "A-17", "ax": 3, "rii": 0.8179, "name": {"ar": "تكامل الخطط الاستراتيجية والتنفيذية والتشغيلية وخطط الموارد الخاصة بإدارة جودة مياه الشرب، وتطوير القوى العاملة، والتمويل، والتحقق التشغيلي، والاستعداد للطوارئ، ومشاركة المجتمع.", "en": "Integrate strategic, executive, operational and resource plans for drinking-water quality management, workforce development, funding, operational verification, emergency preparedness and community engagement."}}, {"id": "A-18", "ax": 3, "rii": 0.8107, "name": {"ar": "تعزيز الإشراف الإداري والاتصال الداخلي والمتابعة الدورية للامتثال والمخاطر التشغيلية وإجراءات التحسين وتوصيات التدقيق.", "en": "Strengthen management oversight, internal communication and periodic follow-up of compliance, operational risks, improvement actions and audit recommendations."}}, {"id": "A-19", "ax": 3, "rii": 0.7786, "name": {"ar": "الاختبار الدوري لخطط الاستجابة للطوارئ وتحديثها، بالاستناد إلى إجراءات محددة مسبقًا للاستجابة للحوادث، وتوزيع واضح للمسؤوليات، وتدريب العاملين.", "en": "Test and update emergency response plans regularly, based on predefined incident procedures, clear responsibilities and staff training."}}, {"id": "A-20", "ax": 4, "rii": 0.8893, "name": {"ar": "توفير موازنات شاملة لدورة الحياة تغطي الموارد البشرية، والصيانة الروتينية والطارئة، وتجديد البنى التحتية، والمواد الكيميائية، وقطع الغيار الحرجة، والنقل، والطاقة، ومعدات السلامة، وتدريب العاملين.", "en": "Provide full life-cycle budgets covering staff, routine and emergency maintenance, infrastructure renewal, chemicals, critical spare parts, transport, energy, safety equipment and training."}}, {"id": "A-21", "ax": 4, "rii": 0.8821, "name": {"ar": "الضبط المنهجي لشراء المواد الكيميائية وإدارة مخزونها من خلال سجلات جرد منتظمة، ومستويات احتياط محددة، وإعادة تجهيز في الوقت المناسب، وتقييم المجهزين، والمراجعة الدورية لمخاطر انقطاع التجهيز.", "en": "Systematically control chemical purchasing and stock through regular inventory records, set reserve levels, timely resupply, supplier evaluation and periodic review of supply-disruption risks."}}, {"id": "A-22", "ax": 4, "rii": 0.875, "name": {"ar": "إدماج قطع الغيار الحرجة والمعدات الاحتياطية وأجهزة القياس ومضخات الجرعات وأدوات الصيانة ضمن التخطيط المالي وإدارة الأصول وخطط المشتريات.", "en": "Include critical spare parts, standby equipment, measuring instruments, dosing pumps and maintenance tools in financial planning, asset management and procurement plans."}}, {"id": "A-23", "ax": 4, "rii": 0.8357, "name": {"ar": "اعتماد تقارير مالية شفافة واتصال منظم بشأن استهلاك المواد الكيميائية ومتطلبات الصيانة واحتياجات المعدات والتكاليف التشغيلية وتخصيصات الموازنة والإنفاق الفعلي.", "en": "Adopt transparent financial reporting and structured communication on chemical consumption, maintenance needs, equipment needs, operating costs, budget allocations and actual spending."}}, {"id": "A-24", "ax": 5, "rii": 0.8143, "name": {"ar": "توفير أعداد كافية من مشغلي العمليات والمشرفين وموظفي الصيانة والمديرين المؤهلين، مع تحديد الحد الأدنى لمتطلبات الكفاءة والشهادات المهنية.", "en": "Provide enough qualified operators, supervisors, maintenance staff and managers, with minimum competency and certification requirements."}}, {"id": "A-25", "ax": 5, "rii": 0.7821, "name": {"ar": "مواءمة برامج التدريب الخاصة بكل وظيفة مع الواجبات الفعلية ومسؤوليات عمليات المعالجة، بما يشمل السيطرة على العمليات والجرعات الكيميائية وقياس التدفق ومراقبة العكورة والأس الهيدروجيني والترشيح وتشغيل المعدات والسلامة والاستجابة للطوارئ.", "en": "Align job-specific training with actual duties in treatment operations, including process control, chemical dosing, flow measurement, turbidity and pH monitoring, filtration, equipment operation, safety and emergency response."}}, {"id": "A-26", "ax": 5, "rii": 0.7643, "name": {"ar": "إضفاء الطابع المؤسسي على التطوير المستمر للقدرات من خلال تقييم الاحتياجات التدريبية، وتنفيذ البرامج، وتقييم فاعليتها، والدورات التنشيطية، والتدريب الميداني تحت الإشراف، والتطوير المهني المستمر.", "en": "Institutionalise continuous capacity building through training-needs assessment, programme delivery, effectiveness evaluation, refresher courses, supervised field training and continuing professional development."}}, {"id": "A-27", "ax": 5, "rii": 0.7607, "name": {"ar": "تحسين تحفيز العاملين واستبقائهم وظروف عملهم من خلال الأجور والمزايا المناسبة، والحوافز، وكفاية الملاك، والإشراف الداعم، ومعدات الوقاية الشخصية، وبيئة العمل الآمنة.", "en": "Improve staff motivation, retention and working conditions through fair pay and benefits, incentives, adequate staffing, supportive supervision, personal protective equipment and a safe workplace."}}, {"id": "A-28", "ax": 5, "rii": 0.7464, "name": {"ar": "إضفاء الطابع المؤسسي على تخطيط القوى العاملة والإحلال الوظيفي، مع تبادل المعرفة ونقل الخبرة الفنية بصورة منظمة لضمان استمرارية الملاك والكفاءة التشغيلية.", "en": "Institutionalise workforce and succession planning, with structured knowledge sharing and transfer of technical expertise to ensure staff continuity and operational competence."}}, {"id": "A-29", "ax": 6, "rii": 0.7893, "name": {"ar": "إنشاء برنامج متكامل للمراقبة التشغيلية ومراقبة جودة المياه يحدد المعايير والمواقع والتكرارات وطرائق القياس والمسؤولين والحدود التشغيلية والإجراءات التصحيحية المرتبطة بها.", "en": "Establish an integrated operational and water-quality monitoring programme that defines parameters, locations, frequencies, methods, responsibilities, operating limits and related corrective actions."}}, {"id": "A-30", "ax": 6, "rii": 0.7964, "name": {"ar": "اعتماد القياس الروتيني والقائم على المخاطر للأس الهيدروجيني والكلور الحر المتبقي والعكورة ومعدل التدفق ودرجة الحرارة والمؤشرات الفيزيائية والكيميائية والميكروبيولوجية ذات الصلة، مع تكثيف المراقبة خلال فترات التغير السريع في مياه المصدر.", "en": "Adopt routine and risk-based measurement of pH, free residual chlorine, turbidity, flow rate, temperature and relevant physical, chemical and microbiological parameters, intensifying monitoring when source water changes rapidly."}}, {"id": "A-31", "ax": 6, "rii": 0.8107, "name": {"ar": "دمج نتائج المراقبة في السيطرة التكيفية على العمليات، بما يشمل تعديل جرعات مواد التخثير والكلور، وتحسين الأس الهيدروجيني، وتقييم أداء الترشيح، وتعديل ممارسات الغسل العكسي، والاستجابة للنتائج التشغيلية غير الطبيعية.", "en": "Feed monitoring results into adaptive process control, including adjusting coagulant and chlorine doses, optimising pH, assessing filtration, adjusting backwashing and responding to abnormal results."}}, {"id": "A-32", "ax": 6, "rii": 0.7536, "name": {"ar": "توحيد نماذج السجلات التشغيلية والتسجيل الإلكتروني للبيانات والمراجعة اليومية وتحليل الاتجاهات والتقارير المنظمة بين مشغلي العمليات والمشرفين وإدارة المحطة والجهات المسؤولة.", "en": "Standardise operating log forms, electronic data recording, daily review, trend analysis and structured reporting between operators, supervisors, plant management and responsible authorities."}}, {"id": "A-33", "ax": 6, "rii": 0.7786, "name": {"ar": "دمج إنذارات التحذير المبكر والإجراءات التصحيحية المحددة مسبقًا وإجراءات الاتصال السريع وإعادة أخذ العينات أو القياس للتحقق من استعادة السيطرة على العمليات والامتثال لمتطلبات جودة المياه.", "en": "Integrate early-warning alarms, predefined corrective actions, rapid communication and re-sampling or re-measurement to confirm control is restored and water-quality requirements are met."}}, {"id": "A-34", "ax": 0, "rii": 0.8286, "name": {"ar": "اعتماد إجراءات فنية لشراء واستلام أجهزة القياس والمراقبة ومعدات الاختبار وفق المواصفات المعتمدة، مع إجراء الفحص الفني والمعايرة والتحقق من المطابقة قبل إدخالها إلى الخدمة.", "en": "Adopt technical procedures for purchasing and receiving measuring, monitoring and test equipment to approved specifications, with inspection, calibration and conformity checks before entering service."}}, {"id": "A-35", "ax": 0, "rii": 0.7786, "name": {"ar": "توفير أجهزة قياس محمولة ومعايرة بوصفها وسائل احتياطية للتحقق الميداني من قراءات أجهزة المراقبة الثابتة، واستخدامها عند تعطل أنظمة القياس المتصلة أو الشك في دقة نتائجها.", "en": "Provide calibrated portable instruments as backup for field checks of fixed monitoring readings, used when online systems fail or their accuracy is in doubt."}}, {"id": "A-36", "ax": 1, "rii": 0.8714, "name": {"ar": "تعديل معايير التشغيل وجرعات المواد الكيميائية وزمن الترسيب ومعدلات الغسل العكسي وفق التغيرات الموسمية والطارئة في خصائص المياه الخام، ولا سيما خلال فترات ارتفاع العكارة.", "en": "Adjust operating parameters, chemical doses, settling time and backwash rates to seasonal and sudden changes in raw water, especially during high turbidity."}}, {"id": "A-37", "ax": 1, "rii": 0.8143, "name": {"ar": "إعداد وتطبيق خطة سلامة مياه متكاملة تعتمد على تحديد المخاطر من المصدر إلى نقطة الاستهلاك، وتربط بين مراقبة نوعية المياه الخام، والسيطرة على عمليات المعالجة، والإجراءات التصحيحية، والتحقق المستمر من سلامة المياه المنتجة.", "en": "Prepare and apply an integrated water safety plan based on risk identification from source to tap, linking raw-water monitoring, process control, corrective actions and continuous verification of water safety."}}, {"id": "A-38", "ax": 1, "rii": 0.8071, "name": {"ar": "إنشاء آلية تنسيق وتشغيل مشتركة بين إدارة محطة المعالجة والجهات المسؤولة عن الموارد المائية لمتابعة نوعية المياه الخام، وأعمال التكرية، والتغيرات في مناسيب وتصريفات المصدر، واتخاذ التعديلات التشغيلية المناسبة في الوقت المناسب.", "en": "Set up a joint coordination mechanism between plant management and water-resources authorities to follow raw-water quality, dredging works and changes in source levels and discharges, and to adjust operation in time."}}, {"id": "A-39", "ax": 2, "rii": 0.8071, "name": {"ar": "إعداد جداول تفصيلية للصيانة الوقائية والتصحيحية تتضمن المعدات، ونوع الصيانة، وتكرارها، والمسؤول عن التنفيذ، وتاريخ الاستحقاق، مع متابعة نسب الإنجاز والانحراف عن الخطة واتخاذ الإجراءات اللازمة عند التأخر.", "en": "Prepare detailed preventive and corrective maintenance schedules listing equipment, maintenance type, frequency, owner and due date, tracking completion and deviation from plan and acting on delays."}}, {"id": "A-40", "ax": 2, "rii": 0.7607, "name": {"ar": "تنفيذ جرد دوري للأصول والمعدات، وتحديث سجل الحالة الفنية لكل معدة بما يشمل العمر التشغيلي، والأعطال السابقة، ونتائج الفحص، والحاجة إلى الإصلاح أو إعادة التأهيل أو الاستبدال.", "en": "Carry out periodic asset and equipment inventories, updating each item’s technical condition record: operating age, past failures, inspection results and need for repair, rehabilitation or replacement."}}, {"id": "A-41", "ax": 2, "rii": 0.7929, "name": {"ar": "تنفيذ جولات تفتيش ميدانية دورية من قبل المشرفين الفنيين للتحقق من حالة المعدات، وتنفيذ مهام الصيانة المجدولة، وصحة السجلات، مع توثيق الملاحظات والإجراءات التصحيحية الناتجة عنها.", "en": "Run periodic field inspection rounds by technical supervisors to check equipment condition, scheduled maintenance and record accuracy, documenting findings and resulting corrective actions."}}, {"id": "A-42", "ax": 3, "rii": 0.8, "name": {"ar": "إعداد واعتماد وتحديث إجراءات تشغيل قياسية مكتوبة لجميع العمليات الرئيسة في المحطة، مع ضبط نسخها وتعميمها على العاملين والتحقق من الالتزام بتطبيقها وتوثيق أي انحرافات عنها.", "en": "Prepare, approve and update written standard operating procedures for all main plant processes, with version control, distribution to staff, compliance checks and recording of deviations."}}, {"id": "A-43", "ax": 3, "rii": 0.7643, "name": {"ar": "تطبيق نظام دوري لتقييم أداء العاملين والمشغلين والمشرفين استنادًا إلى معايير واضحة تشمل الكفاءة الفنية، والالتزام بالإجراءات، ودقة السجلات، والاستجابة للحالات التشغيلية، مع إعداد خطط تحسين فردية عند الحاجة.", "en": "Apply periodic performance appraisal of workers, operators and supervisors against clear criteria (technical competence, procedure compliance, record accuracy, response to operating events), with individual improvement plans where needed."}}, {"id": "A-44", "ax": 3, "rii": 0.7929, "name": {"ar": "تنفيذ برامج تفتيش إداري وتشغيلي دورية ومفاجئة للتحقق من الالتزام بإجراءات التشغيل القياسية، وصحة السجلات، وجاهزية المعدات، وتنفيذ الإجراءات التصحيحية، مع توثيق النتائج ومتابعة إغلاق الملاحظات.", "en": "Run periodic and unannounced administrative and operational inspections to check SOP compliance, record accuracy, equipment readiness and corrective actions, documenting results and following up closure of findings."}}, {"id": "A-45", "ax": 3, "rii": 0.8179, "name": {"ar": "اعتماد معايير واضحة لاختيار وتكليف القيادات الإدارية والفنية في محطات المياه، تستند إلى الخبرة والكفاءة والتخصص والقدرة على إدارة التشغيل والصيانة والطوارئ واتخاذ القرار.", "en": "Adopt clear criteria for selecting and appointing administrative and technical leaders in water plants, based on experience, competence, specialisation and ability to manage operation, maintenance, emergencies and decisions."}}, {"id": "A-46", "ax": 3, "rii": 0.7929, "name": {"ar": "تفعيل نظام السلامة والصحة المهنية في محطات المعالجة، مع تحديد المخاطر، وتوفير معدات الوقاية، وتنفيذ التفتيش والتدريب، وتوثيق الحوادث والإجراءات التصحيحية.", "en": "Activate an occupational health and safety system in treatment plants: risk identification, protective equipment, inspection and training, and recording of incidents and corrective actions."}}, {"id": "A-47", "ax": 4, "rii": 0.8893, "name": {"ar": "تخصيص بند مالي مستقل ومستمر لشراء المواد الكيميائية ومواد التعقيم والمواد التشغيلية الحرجة، مع تحديد مستوى احتياط للطوارئ وإعادة التمويل والتجهيز قبل بلوغ الحد الأدنى للمخزون.", "en": "Allocate a separate, ongoing budget line for chemicals, disinfectants and critical operating materials, with an emergency reserve level and refunding and resupply before minimum stock is reached."}}, {"id": "A-48", "ax": 4, "rii": 0.8536, "name": {"ar": "إفراد بنود واضحة ضمن الموازنة التشغيلية لاحتياجات التشغيل والصيانة الوقائية والطارئة، بما يمنع تحويلها إلى أغراض أخرى ويضمن استمرارية الخدمة وعدم توقف الأنشطة الحرجة.", "en": "Set clear operating-budget lines for operation and preventive and emergency maintenance, protected from reallocation, to keep the service running and critical activities going."}}, {"id": "A-49", "ax": 4, "rii": 0.8036, "name": {"ar": "اعتماد سياسة شراء توازن بين الكلفة والجودة، مع إعطاء الأفضلية للمنتجات المحلية أو الحكومية المطابقة للمواصفات الفنية عند ثبوت قدرتها على تقليل الكلفة وضمان استمرارية التجهيز.", "en": "Adopt a procurement policy that balances cost and quality, preferring local or state products that meet technical specifications where they lower cost and secure supply."}}, {"id": "A-50", "ax": 4, "rii": 0.8643, "name": {"ar": "تطوير آليات تحصيل رسوم خدمة المياه وتحسين كفاءتها، مع توجيه جزء واضح من الإيرادات المتحققة لدعم تشغيل المحطات وصيانتها وشراء المواد الكيميائية وقطع الغيار الحرجة.", "en": "Develop and improve water-fee collection, directing a clear share of revenue to plant operation and maintenance and to buying chemicals and critical spare parts."}}, {"id": "A-51", "ax": 5, "rii": 0.7964, "name": {"ar": "إعداد خطة ملاك وظيفي لكل محطة تستند إلى حجم المحطة وتقنياتها وساعات التشغيل واحتياجات الصيانة، مع تعيين أو توزيع العاملين وفق التخصصات والكفاءات المطلوبة لكل وظيفة.", "en": "Prepare a staffing plan for each plant based on its size, technology, operating hours and maintenance needs, appointing or assigning staff by the specialisations and competencies each post requires."}}, {"id": "A-52", "ax": 5, "rii": 0.7571, "name": {"ar": "إعداد أوصاف وظيفية معتمدة لجميع الوظائف التشغيلية والفنية والإشرافية، تحدد الواجبات والمسؤوليات والمؤهلات والمهارات والصلاحيات ومتطلبات الأداء لكل وظيفة.", "en": "Prepare approved job descriptions for all operational, technical and supervisory posts, defining duties, responsibilities, qualifications, skills, authority and performance requirements."}}, {"id": "A-53", "ax": 5, "rii": 0.7143, "name": {"ar": "تخصيص بند مالي سنوي مستقل للتدريب والتطوير المهني، يغطي التدريب النظري والميداني والدورات التنشيطية وشهادات الكفاءة وتحديث المعارف الفنية.", "en": "Allocate a separate annual budget line for training and professional development, covering classroom and field training, refresher courses, competency certificates and technical updates."}}, {"id": "A-54", "ax": 5, "rii": 0.7821, "name": {"ar": "إعادة توزيع القوى العاملة بين المحطات والوحدات وفق الاحتياج الفعلي، والاستفادة من الموظفين الفائضين بعد تأهيلهم، مع استحداث درجات وظيفية جديدة عند عدم كفاية الموارد البشرية المتاحة.", "en": "Redistribute staff between plants and units according to actual need, retraining surplus staff, and create new posts where available staff are insufficient."}}, {"id": "A-55", "ax": 5, "rii": 0.7214, "name": {"ar": "تطبيق نظام لتقييم فاعلية برامج التدريب من خلال الاختبارات القبلية والبعدية، والملاحظة الميدانية، ومؤشرات الأداء، وربط نتائج التقييم بخطط التدريب اللاحقة واختيار المشاركين.", "en": "Apply a system to evaluate training effectiveness through pre- and post-tests, field observation and performance indicators, linking results to later training plans and participant selection."}}, {"id": "A-56", "ax": 6, "rii": 0.725, "name": {"ar": "تشكيل لجنة فنية متعددة الاختصاصات على مستوى الجهة المسؤولة تتولى إعداد ومراجعة واعتماد بروتوكولات المراقبة والسيطرة، وتحديث الحدود التشغيلية ونماذج التسجيل والإجراءات التصحيحية وفق نتائج الأداء والمتطلبات التنظيمية.", "en": "Form a multidisciplinary technical committee at the responsible authority to prepare, review and approve monitoring and control protocols, and update operating limits, record forms and corrective actions based on performance and regulations."}}, {"id": "A-57", "ax": 6, "rii": 0.725, "name": {"ar": "إجراء مراجعة دورية للممارسات والمعايير الوطنية المعتمدة في المراقبة والسيطرة، ومقارنتها بالممارسات الإقليمية والدولية الملائمة، والاستفادة منها في تحديث البروتوكولات وطرائق القياس والتوثيق والاستجابة التشغيلية.", "en": "Review national monitoring and control practices and standards periodically against suitable regional and international practice, using them to update protocols, measurement methods, documentation and operational response."}}, {"id": "A-58", "ax": 6, "rii": 0.7357, "name": {"ar": "إعداد تقارير دورية موحدة عن نتائج المراقبة والانحرافات التشغيلية والإجراءات التصحيحية وحالات عدم الامتثال، ورفعها إلى إدارة المحطة والجهات الإشرافية المختصة ضمن مدد زمنية محددة، مع متابعة القرارات والإجراءات الناتجة عنها.", "en": "Prepare standardised periodic reports on monitoring results, operational deviations, corrective actions and non-compliance, submitting them to plant management and supervisory bodies on set deadlines and following up resulting decisions."}}, {"id": "A-59", "ax": 0, "rii": 0.8179, "name": {"ar": "تحديث منظومات السيطرة والأتمتة بصورة مرحلية، وربط وحدات المعالجة بنظام مراقبة وتحكم مركزي، مع تنفيذ برامج دورية للصيانة والتحديث والنسخ الاحتياطي.", "en": "Upgrade control and automation systems in phases, connecting treatment units to a central monitoring and control system, with regular maintenance, updates and backups."}}, {"id": "A-60", "ax": 1, "rii": 0.8, "name": {"ar": "إعداد برنامج تشغيلي موحد يحدد تسلسل تشغيل وإيقاف الوحدات والمضخات، وآلية التناوب بينها، ومتطلبات تسليم واستلام المناوبات، مع توثيق جميع التغييرات التشغيلية.", "en": "Prepare a unified operating programme defining the start/stop sequence of units and pumps, their rotation and shift handover requirements, recording all operational changes."}}, {"id": "A-61", "ax": 2, "rii": 0.8214, "name": {"ar": "إعداد خطة توقفات تشغيلية مجدولة ومنسقة بين وحدات المحطة، مع الاستفادة من الوحدات الاحتياطية وتوزيع الأحمال بما يسمح بتنفيذ أعمال الصيانة من دون التأثير الجوهري في استمرارية تجهيز المياه.", "en": "Prepare a scheduled, coordinated downtime plan across plant units, using standby units and load sharing so maintenance can be done without materially affecting water supply."}}, {"id": "A-62", "ax": 3, "rii": 0.7893, "name": {"ar": "اعتماد آلية تنسيق رسمية بين الأقسام والجهات الساندة، تتضمن اجتماعات دورية، ومسارات اتصال واضحة، وتحديد المسؤوليات والمدد الزمنية، ومتابعة تنفيذ القرارات والإجراءات التصحيحية.", "en": "Adopt a formal coordination mechanism between departments and supporting units, with regular meetings, clear communication channels, defined responsibilities and deadlines, and follow-up of decisions and corrective actions."}}, {"id": "A-63", "ax": 4, "rii": 0.8429, "name": {"ar": "إعداد خطة شراء سنوية مبكرة مرتبطة بالاحتياجات التشغيلية الفعلية، وتوفير مخزون احتياطي للمواد والمستلزمات الحرجة، مع إعطاء أولوية لإطلاق وصرف تخصيصات التشغيل والصيانة في الأوقات المحددة.", "en": "Prepare an early annual procurement plan tied to actual operating needs, keep reserve stock of critical materials and supplies, and prioritise timely release of operation and maintenance allocations."}}, {"id": "A-64", "ax": 5, "rii": 0.7679, "name": {"ar": "توثيق الخبرات والإجراءات التشغيلية المتراكمة، وتنفيذ برامج تدريب داخلية وإرشاد وظيفي، واعتماد آلية منظمة لنقل المعرفة من العاملين ذوي الخبرة إلى الملاكات الجديدة.", "en": "Document accumulated operating experience and procedures, run internal training and mentoring, and adopt a structured mechanism to transfer knowledge from experienced staff to new staff."}}, {"id": "A-65", "ax": 6, "rii": 0.75, "name": {"ar": "اعتماد مجموعة واضحة من مؤشرات الأداء التشغيلية الرئيسة (KPIs)، ومراجعتها وتحليل اتجاهاتها بصورة دورية، مع تحديد القيم المستهدفة وحدود الإنذار واتخاذ الإجراءات التصحيحية عند ظهور الانحرافات.", "en": "Adopt a clear set of key operational performance indicators (KPIs), review them and analyse their trends regularly, setting target values and alarm limits and taking corrective action when deviations appear."}}];

    k.compute = i => nm(i.v);
    k.calc = B(`${L0(s.lbl || s.name, 'ar')} — قيمة مسجّلة مباشرة`, `${L0(s.lbl || s.name, 'en')} — recorded directly`);
  } else if (s.method === 'duration'){
    k.inputs = [{k:'dur', label:s.lbl || s.name, unitSel:true}];
    k.compute = i => { const d = nm(i.dur); if (d == null || Number.isNaN(d)) return d; return i.durUnit === 'min' ? d/60 : d; };
    k.calc = B(`${L0(s.lbl || s.name, 'ar')} خلال الفترة (تُحوَّل الدقائق إلى ساعات)`, `${L0(s.lbl || s.name, 'en')} in the period (minutes converted to hours)`);
  } else if (s.method === 'ratio'){
    k.inputs = [{k:'den', label:s.den, unit:s.iu, int:!s.iuDec}, {k:'num', label:s.num, unit:s.iu, int:!s.iuDec}];
    k.compute = i => { const d = nm(i.den), n = nm(i.num); if (d == null || n == null) return null; if (Number.isNaN(d) || Number.isNaN(n) || d <= 0) return NaN; return n/d*100; };

    k.calc = B(`(${L0(s.num,'ar')} ÷ ${L0(s.den,'ar')}) × 100`, `(${L0(s.num,'en')} ÷ ${L0(s.den,'en')}) × 100`);
  } else {
    k.inputs = [{k:'cnt', label:s.cnt, unit:s.cu, int:true}, {k:'sum', label:s.sum, unit:s.unit}];
    k.compute = i => { const c = nm(i.cnt), t = nm(i.sum); if (c == null || t == null) return null; if (Number.isNaN(c) || Number.isNaN(t) || c <= 0) return NaN; return t/c; };

}

/* ---------- Charts (SVG; time runs in reading direction) ---------- */
const CHARTS = {};
let chartSeq = 0;
function niceScale(min, max, ticks = 4){
  if (min === max){ min -= 1; max += 1; }
  const raw = (max - min)/ticks, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw) || raw;
  return {min:Math.floor(min/st)*st, max:Math.ceil(max/st)*st, step:st};
}
function lineChart(o){
  const id = 'c' + (++chartSeq), rtl = isRTL();
  const W = 640, H = o.h || 220, pT = 14, pB = 30, axisW = 46, thrW = o.lines && o.lines.length ? 64 : 12;
  const n = o.labels.length;
  const vals = o.series.flatMap(s => s.values).filter(v => v != null && !Number.isNaN(v)).concat((o.lines||[]).map(l => l.v));
  if (o.zero) vals.push(0);
  if (!vals.length) vals.push(0, 1);
  const sc = niceScale(Math.min(...vals), Math.max(...vals));
  // LTR frame: axis on the left, threshold labels on the right; mirrored for RTL
  const x0 = axisW, x1 = W - thrW;
  const lx = i => n === 1 ? (x0 + x1)/2 : x0 + i*(x1 - x0)/(n - 1);
  const X = v => rtl ? W - v : v;
  const x = i => X(lx(i));
  const y = v => pT + (sc.max - v)/(sc.max - sc.min)*(H - pT - pB);
  const ancS = rtl ? 'start' : 'end', ancE = rtl ? 'end' : 'start';
  let g = '';
  for (let t = sc.min; t <= sc.max + 1e-9; t += sc.step) g += `<line class="gl" x1="${X(x0)}" x2="${X(x1)}" y1="${y(t)}" y2="${y(t)}"/><text class="axn" x="${X(x0 - 8)}" y="${y(t) + 4}" text-anchor="${ancS}">${fmtN(t, 2)}</text>`;
  const xl = o.labels.map((l, i) => `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('');
  const thr = (o.lines||[]).map(l => `<line class="thr" x1="${X(x0)}" x2="${X(x1)}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.color}"/><text class="thl" x="${X(x1 + 6)}" y="${y(l.v) + 4}" text-anchor="${ancE}" fill="${l.color}">${esc(l.label)}</text>`).join('');
  const band = o.band ? `<rect x="${Math.min(X(x0), X(x1))}" width="${x1 - x0}" y="${y(Math.min(sc.max, o.band[1]))}" height="${Math.max(0, y(Math.max(sc.min, o.band[0])) - y(Math.min(sc.max, o.band[1])))}" fill="var(--ok)" opacity=".08"/>` : '';
  const paths = o.series.map(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v == null || Number.isNaN(v)){ pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true; });
    const pts = s.values.map((v, i) => (v == null || Number.isNaN(v)) ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="${i === n - 1 ? 4.5 : 2.6}" fill="${i === n - 1 ? s.color : 'var(--surface)'}" stroke="${s.color}" stroke-width="2"/>`).join('');
    let area = '';
    if (o.area && o.series.length === 1){ const p2 = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean); if (p2.length > 1) area = `<path d="M${p2[0][0]},${y(sc.min)} ${p2.map(p => `L${p[0]},${p[1]}`).join(' ')} L${p2[p2.length-1][0]},${y(sc.min)} Z" fill="${s.color}" opacity=".08"/>`; }
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
  }).join('');
  const colW = n > 1 ? (x1 - x0)/(n - 1) : (x1 - x0);
  const hits = o.labels.map((l, i) => `<rect class="hit" data-c="${id}" data-i="${i}" x="${x(i) - colW/2}" y="${pT}" width="${colW}" height="${H - pT - pB}"/>`).join('');
  CHARTS[id] = { labels:o.labels, series:o.series, fmt:o.fmt || (v => fmtN(v, 2)), x, W };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${band}${g}${thr}${paths}<line class="guide" x1="0" x2="0" y1="${pT}" y2="${H - pB}" visibility="hidden"/>${xl}${hits}</svg><div class="tip"></div></div>`;
}
function sparkline(vals, color){
  const W = 120, H = 34, p = 3, f = vals.filter(v => v != null);
  if (f.length < 2) return '';

  if (!su.job.trim()) e.job = tr('أدخل المنصب أو الوظيفة.','Enter your job title.');

  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(su.email.trim())) e.email = tr('صيغة البريد الإلكتروني غير صحيحة.','This email address is not valid.');

}

        ${alerts.length ? `<div class="tbl-wrap"><table class="tbl stackable"><thead><tr><th>${tr('المحطة','Plant')}</th><th>${tr('المؤشر','Indicator')}</th><th>${tr('القيمة المسجلة','Recorded value')}</th><th>${tr('الحد المعتمد','Approved limit')}</th><th>${tr('الحالة','Status')}</th><th>${tr('تاريخ التقييم','Assessed on')}</th></tr></thead><tbody>${alertRows}</tbody></table></div>`
          : emptyState('check', tr('لا توجد تنبيهات','No alerts'), tr('جميع المؤشرات ضمن الحدود، أو عولجت انحرافاتها.','All indicators are within limits, or their deviations have been treated.'))}

      <div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:6px"><span>${tr(`اكتمل إدخال ${N(done)} من ${N(tot)} مؤشرات`,`${N(done)} of ${N(tot)} indicators complete`)}</span>${sm.c.error ? `<span style="color:var(--crit)">${tr(`${N(sm.c.error)} خطأ يلزم تصحيحه`,`${N(sm.c.error)} error to fix`)}</span>` : ''}</div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${done}"><i style="width:${tot ? done/tot*100 : 0}%"></i></div></section>
      <div class="kcards">${cards}</div>`;
    foot = `<button class="btn secondary" data-act="wprev">${icon('back','sm')}${tr('السابق','Back')}</button><span class="grow">${sm.c.missing + sm.c.partial ? tr(`${N(sm.c.missing + sm.c.partial)} مؤشر بلا بيانات كاملة`,`${N(sm.c.missing + sm.c.partial)} indicator without complete data`) : tr('جميع المؤشرات مكتملة','All indicators complete')}</span>
      <button class="btn secondary" data-act="wdraft">${icon('save','sm')}${tr('حفظ كمسودة','Save as draft')}</button><button class="btn primary" data-act="wnext">${tr('التالي: المراجعة','Next: review')}${icon('fwd','sm')}</button>`;
  }

  if (w.step === 4){
    const sm = wizardSummary(w), miss = sm.rows.filter(r => r.state === 'missing' || r.state === 'partial'), errs = sm.rows.filter(r => r.state === 'error');
    const tr_ = sm.rows.map(r => { const inp = w.inputs[r.k.id] || {};
      const det = r.k.inputs.map(f => `${esc(L(f.label))}: <span class="n">${esc(inp[f.k] || '—')}</span>${f.unitSel ? ` ${inp.durUnit === 'min' ? tr('دقيقة','min') : tr('ساعة','h')}` : ''}`).join('<br>');
      return `<tr style="${r.state === 'error' ? 'background:var(--crit-soft)' : (r.state !== 'complete' ? 'background:var(--warn-soft)' : '')}"><td data-l="${tr('المؤشر','Indicator')}" class="kname">${esc(L(r.k.name))}<small>${r.k.id}</small></td><td data-l="${tr('المدخلات','Inputs')}" style="font-size:13px;color:var(--fg-2)">${det}</td><td data-l="${tr('القيمة','Value')}" class="num">${vText(r.k, r.value)}</td><td data-l="${tr('حالة الإدخال','Entry status')}">${esPill(r.state)}${Object.values(r.errs).map(e => `<div style="font-size:12px;color:var(--crit);margin-top:4px">${e}</div>`).join('')}</td>
        <td data-l=""><button class="btn ghost sm" data-act="wstep" data-v="3">${tr('تعديل','Edit')}</button></td></tr>`; }).join('');
    const canApprove = !errs.length && (!miss.length || w.ack) && sm.c.complete > 0;
    body = `<section class="card"><div class="card-h"><div><h2>${tr('مراجعة البيانات','Review data')}</h2><div class="desc">${tr('تحقّق من القراءات قبل الاعتماد. لا تُعرض نتيجة لأي مؤشر بياناته غير مكتملة.','Check the readings before approving. No result is shown for an indicator with incomplete data.')}</div></div></div>
      <div class="kvs" style="margin-bottom:14px"><div><small>${tr('المحطة','Plant')}</small><b>${esc(stShort(st))}</b></div><div><small>${tr('فترة المتابعة','Monitoring period')}</small><b>${wLabel(w)}</b></div><div><small>${tr('من — إلى','From — to')}</small><b>${N(w.start)} — ${N(w.end)}</b></div><div><small>${tr('أدخلها','Entered by')}</small><b>${esc(L(w.enteredBy))}</b></div><div><small>${tr('إصدار المحددات','Limits version')}</small><b>${N(api.currentVer().ver)}</b></div></div>
      <div class="tbl-wrap"><table class="tbl stackable"><thead><tr><th>${tr('المؤشر','Indicator')}</th><th>${tr('المدخلات','Inputs')}</th><th>${tr('القيمة','Value')}</th><th>${tr('حالة الإدخال','Entry status')}</th><th></th></tr></thead><tbody>${tr_}</tbody></table></div></section>
      ${errs.length ? `<div class="callout crit" role="alert">${icon('octagon')}<div class="body"><b>${tr('لا يمكن الاعتماد بوجود أخطاء إدخال.','You cannot approve while there are input errors.')}</b> ${tr(`صحّح ${N(errs.length)} مؤشر في خطوة إدخال القراءات.`,`Fix ${N(errs.length)} indicator in the readings step.`)}</div></div>` : ''}
      ${miss.length ? `<div class="callout warn">${icon('alert')}<div class="body"><b>${tr(`بيانات ناقصة في ${N(miss.length)} مؤشر:`,`Missing data in ${N(miss.length)} indicator:`)}</b> ${miss.map(r => esc(L(r.k.name))).join(tr('، ',', '))}. ${tr('ستُصنَّف «بيانات غير كافية» ولن تُعرض لها نتيجة.','They will be marked “Insufficient data” with no result.')}
        <label class="chk" style="margin-top:8px"><input type="checkbox" ${w.ack ? 'checked' : ''} data-act-change="wack"><span>${tr('أؤكد اعتماد التقييم مع وجود بيانات ناقصة، وأن ذلك سيُسجَّل في سجل التتبع.','I confirm approving with missing data, and that this will be recorded in the audit trail.')}</span></label></div></div>` : ''}`;
    foot = `<button class="btn secondary" data-act="wprev">${icon('back','sm')}${tr('السابق','Back')}</button><span class="grow">${tr(`${N(sm.c.complete)} مكتمل · ${N(miss.length)} ناقص · ${N(errs.length)} خطأ`,`${N(sm.c.complete)} complete · ${N(miss.length)} missing · ${N(errs.length)} error`)}</span>
      <button class="btn secondary" data-act="wdraft">${icon('save','sm')}${tr('حفظ كمسودة','Save as draft')}</button><button class="btn primary" data-act="wapprove" ${canApprove ? '' : 'disabled'}>${icon('tick','sm')}${tr('اعتماد وإجراء التقييم','Approve and evaluate')}</button>`;
  }
  return `<div class="page"><div class="ph"><div class="t"><div class="eyebrow">${tr('المرحلة الأولى · قياس الأداء','Stage 1 · Performance measurement')}${w.draftId ? ` · ${tr('مسودة','Draft')} ${codeChip(w.draftId)}` : ''}</div><h1 class="h1">${tr('إنشاء تقييم جديد','New assessment')}</h1></div></div>
    ${stepper}${body}<div class="wiz-foot">${foot}</div></div>`;
}
