const auditList = items => `<ul class="audit">${items.map(x => `<li><div><div>${esc(L(x.what))}</div><div class="when">${esc(x.who === 'system' ? tr('النظام','System') : L(x.who))} · ${N(x.at)}</div></div></li>`).join('')}</ul>`;
function pageResults(){
  const a = api.assessment(S.params.id); if (!a) return pageAssessments();
  const st = api.station(a.stationId), rows = evalAs(a), c = counts(rows), prev = prevAs(a);
  const prows = prev ? Object.fromEntries(evalAs(prev).map(r => [r.k.id, r])) : {};
  const complete = rows.filter(r => r.s !== 'na').length, devs = c.warn + c.crit;
  const probs = D().problems.filter(p => p.assessmentId === a.id), firstProb = probs[0];
  const order = ['crit','warn','na','nolimit'];
  const callouts = rows.filter(r => r.s !== 'ok').sort((x, y) => order.indexOf(x.s) - order.indexOf(y.s)).map(r => {
    const pr = probs.find(p => p.kpiId === r.k.id), done = pr && !problemStage(pr).open;
    if (done) return `<div class="callout info">${icon('check')}<div class="body">${tr(`عولجت مشكلة «${esc(L(r.k.name))}» (${vText(r.k, r.v)}): ${problemStage(pr).label}.`,`The “${esc(L(r.k.name))}” problem (${vText(r.k, r.v)}) is resolved: ${problemStage(pr).label}.`)}</div><button class="btn secondary sm" data-act="go" data-r="problem" data-id="${pr.id}">${tr('عرض','View')}</button></div>`;
    const cls = {crit:'crit', warn:'warn', na:'na', nolimit:'nl'}[r.s];
    const msg = {
      crit:tr(`تجاوز مؤشر «${esc(L(r.k.name))}» الحد الحرج المحدد لهذه الفترة (${vText(r.k, r.v)}؛ الحد الحرج: ${limText(r.k, r.L, 'crit')})، ويوصى بتحديد العوائق المرتبطة به.`,`“${esc(L(r.k.name))}” exceeded the critical limit for this period (${vText(r.k, r.v)}; critical: ${limText(r.k, r.L, 'crit')}). Identifying the related obstacles is recommended.`),
      warn:tr(`تجاوز مؤشر «${esc(L(r.k.name))}» حد التحذير (${vText(r.k, r.v)}؛ التحذير: ${limText(r.k, r.L, 'warn')}). يوصى بمتابعته، ويمكن فتح مشكلة لتحديد عوائقه.`,`“${esc(L(r.k.name))}” passed the warning limit (${vText(r.k, r.v)}; warning: ${limText(r.k, r.L, 'warn')}). Keep it under follow-up; you can open a problem to identify its obstacles.`),
      na:tr(`لا تتوفر بيانات كافية لتقييم «${esc(L(r.k.name))}»، لذلك لم تُعرض له نتيجة.`,`There is not enough data to evaluate “${esc(L(r.k.name))}”, so no result is shown.`),
      nolimit:tr(`لا توجد محددات معتمدة لمؤشر «${esc(L(r.k.name))}»؛ سُجّلت القيمة (${vText(r.k, r.v)}) دون تقييم.`,`“${esc(L(r.k.name))}” has no approved limits; the value (${vText(r.k, r.v)}) was recorded without evaluation.`)
    }[r.s];
    const btn = (r.s === 'crit' || r.s === 'warn') ? (pr ? `<button class="btn ${r.s === 'crit' ? 'primary' : 'secondary'} sm" data-act="go" data-r="problem" data-id="${pr.id}">${tr('تحديد العوائق','Identify obstacles')}${icon('fwd','sm')}</button>` : `<button class="btn secondary sm" data-act="open-problem" data-id="${a.id}" data-k="${r.k.id}">${tr('فتح مشكلة للتقييم','Open a problem')}</button>`) : '';
    return `<div class="callout ${cls}">${icon(STI[r.s].ic)}<div class="body">${msg}</div>${btn}</div>`;
  }).join('');
  const tr_ = grpRows(rows, r => {
    const p = prows[r.k.id], b = p ? better(r.k, r.v, p.v, r.L) : null;
    const delta = (p && r.v != null && p.v != null) ? `<span class="row" style="gap:4px;color:${b > 0 ? 'var(--ok)' : b < 0 ? 'var(--crit)' : 'var(--fg-3)'}">${icon(r.v > p.v ? 'arrowup' : r.v < p.v ? 'arrowdown' : 'minus','sm')}${N(fmtN(Math.abs(r.v - p.v), r.k.dec ?? 1) + (unitOf(r.k) === '%' ? tr(' نقطة',' pts') : ''))}<span style="font-size:12px">${b > 0 ? tr('تحسّن','better') : b < 0 ? tr('تراجع','worse') : tr('دون تغيير','no change')}</span></span>` : `<span class="faint" style="font-size:12.5px">${tr('لا توجد بيانات قابلة للمقارنة','No comparable data')}</span>`;
    return `<tr class="click" data-act="drawer" data-id="${a.id}" data-k="${r.k.id}" tabindex="0">
      <td data-l="${tr('المؤشر','Indicator')}" class="kname">${esc(L(r.k.name))}<small>${r.k.id}${r.k.demo ? ' · ' + tr('مثال','example') : ''}</small></td>
      <td data-l="${tr('القيمة المسجلة','Recorded value')}" class="num">${vText(r.k, r.v)}</td>
      <td data-l="${tr('المستهدف / الحد','Target / limit')}" style="font-size:13px">${r.L ? `${limText(r.k, r.L, 'target')}<div class="faint" style="font-size:12px">${tr('حرج','Critical')}: ${limText(r.k, r.L, 'crit')}</div>` : `<span style="color:var(--nl)">${tr('لا توجد محددات','No limits')}</span>`}</td>
      <td data-l="${tr('الموقع على المقياس','On the scale')}" class="full" style="min-width:170px">${r.L ? scaleBar(r.k, r.v, r.L, {ticks:false}) : ''}</td>
      <td data-l="${tr('مستوى الأداء','Performance level')}">${pill(r.s)}</td>
      <td data-l="${tr('الفرق عن الفترة السابقة','Change vs previous period')}" style="font-size:13px">${delta}</td>
      <td data-l=""><span class="btn ghost sm">${tr('التفاصيل','Details')}${icon('fwd','sm')}</span></td></tr>`;
  }, 7);
  const links = {}; if (firstProb){ links[2] = ['problem', firstProb.id]; links[3] = ['problem', firstProb.id, 'actions']; }
  return `<div class="page">
    <div class="ph"><div class="t"><button class="crumb" data-act="go" data-r="assessments">${icon('back','sm')}${tr('نتائج التقييمات','Assessment results')}</button><h1 class="h1">${tr('نتائج تقييم الأداء','Performance results')}</h1><p class="lead">${esc(stName(st))} · ${pLabel(a)}</p></div>
      <div class="acts"><button class="btn secondary" data-act="report-for" data-id="${a.id}">${icon('file')}${tr('التقرير','Report')}</button></div></div>
    ${phases(1, links)}
    <section class="card"><div class="row" style="gap:18px;align-items:center">
      <div class="row" style="gap:12px">${ring(complete/rows.length, tr('اكتمال البيانات','Data completeness'))}<div><div class="faint" style="font-size:12.5px">${tr('اكتمال البيانات','Data completeness')}</div><div style="font-size:20px;font-weight:600">${N(Math.round(complete/rows.length*100) + '%')}</div></div></div>
      <div class="kvs" style="flex:1;min-width:260px"><div><small>${tr('المؤشرات المقيّمة','Indicators evaluated')}</small><b>${tr(`${N(c.ok + c.warn + c.crit)} من ${N(rows.length)}`,`${N(c.ok + c.warn + c.crit)} of ${N(rows.length)}`)}</b></div><div><small>${tr('الانحرافات المكتشفة','Deviations found')}</small><b style="color:${devs ? 'var(--crit)' : 'inherit'}">${N(devs)}</b></div>
        <div><small>${tr('فترة المتابعة','Monitoring period')}</small><b>${ptLabel(a.months||1)}</b></div><div><small>${tr('من — إلى','From — to')}</small><b>${N(a.start)} — ${N(a.end)}</b></div><div><small>${tr('إصدار المحددات','Limits version')}</small><b>${N(a.limitsVer)}</b></div><div><small>${tr('رقم التقييم','Assessment no.')}</small><b class="mono n">${a.id}</b></div></div></div></section>
    ${callouts ? `<div class="stack" style="gap:10px">${callouts}</div>` : ''}
    <section class="card"><div class="card-h"><div><h2>${tr('جدول النتائج','Results')}</h2><div class="desc">${tag(tr('قيمة مسجّلة','Recorded value'),'rec')} ${tag(tr('قيمة محسوبة','Calculated value'),'calc')} ${tag(tr('مستوى الأداء: ناتج عن المقارنة بالمحددات','Performance level: from comparison with limits'),'inf')} — ${tr('اختر مؤشراً لعرض تفاصيله.','Choose an indicator for details.')}</div></div></div>
      <div class="tbl-wrap"><table class="tbl stackable"><thead><tr><th>${tr('المؤشر','Indicator')}</th><th>${tr('القيمة المسجلة','Recorded value')}</th><th>${tr('المستهدف / الحد المعتمد','Target / approved limit')}</th><th>${tr('الموقع على المقياس','On the scale')}</th><th>${tr('مستوى الأداء','Performance level')}</th><th>${tr('الفرق عن الفترة السابقة','Change vs previous')}</th><th></th></tr></thead><tbody>${tr_}</tbody></table></div>
      <p class="faint" style="font-size:12.5px;margin-top:10px">${icon('info','sm')} ${tr('مستوى الأداء ناتج عن مقارنة القيمة بالمحددات فقط، ولا يشير إلى سبب الانحراف.','The performance level comes only from comparing the value with the limits; it does not indicate the cause of a deviation.')}</p></section>
    <section class="card"><div class="card-h"><div><h2>${tr('سجل التتبع','Audit trail')}</h2><div class="desc">${tr('من أدخل البيانات ومتى، والقرارات المتخذة على هذا التقييم','Who entered the data and when, and decisions taken on this assessment')}</div></div></div>
      ${auditList(a.audit.concat(probs.flatMap(p => p.audit)))}</section>
  </div>`;
}

function kpiDrawer(){
  const d = S.drawer, a = api.assessment(d.id), k = kpi(d.k), st = api.station(a.stationId);
  const Lm = api.limits(a.limitsVer)[k.id] ?? null, v = a.values[k.id], s = statusOf(k, v, Lm);
  const hist = api.forStation(st.id, a.months||1).filter(x => endKey(x) <= endKey(a) && x.kpis.includes(k.id));
  const lines = Lm ? ((dk(k, Lm).dir === 'range') ? [{v:Lm.min, label:tr('حد أدنى','Min'), color:'var(--warn)'},{v:Lm.max, label:tr('حد أعلى','Max'), color:'var(--warn)'}] : [{v:Lm.warn, label:tr('تحذير','Warning'), color:'var(--warn)'},{v:Lm.crit, label:tr('حرج','Critical'), color:'var(--crit)'}]) : [];
  const chart = hist.length ? lineChart({labels:hist.map(pShortA), series:[{name:stShort(st), color:'var(--accent)', values:hist.map(x => x.values[k.id])}], lines, area:true, zero:k.dir !== 'range', h:200, fmt:x => fmtN(x, k.dec ?? 1), aria:L(k.name)}) : '';
  const vers = [...new Set(hist.map(x => x.limitsVer))];
  const resText = { crit:tr('تجاوزت القيمة الحد الحرج المعتمد لهذه الفترة، ويوصى بتحديد العوائق المرتبطة بها. لا تحدد هذه النتيجة سبب الانحراف.','The value exceeded the approved critical limit for this period; identifying the related obstacles is recommended. This result does not establish the cause.'),
    warn:tr('تجاوزت القيمة حد التحذير دون بلوغ الحد الحرج. يوصى بالمتابعة في الفترة القادمة.','The value passed the warning limit without reaching the critical limit. Follow it up next period.'),
    ok:tr(`القيمة ضمن الحدود المقبولة وفق إصدار المحددات ${a.limitsVer}.`,`The value is within acceptable limits under limits version ${a.limitsVer}.`),
    na:tr('لا تتوفر بيانات كافية؛ لم تُحسب نتيجة لهذا المؤشر.','Not enough data; no result was calculated.'),
    nolimit:tr('لا توجد محددات معتمدة؛ سُجّلت القيمة للاطلاع فقط.','No approved limits; the value is recorded for reference only.') }[s];
  const inp = a.inputs[k.id], pr = D().problems.find(p => p.assessmentId === a.id && p.kpiId === k.id);
  return `<div class="overlay drawer-ov" data-act="close-ov-bg"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t">
    <div class="sheet-h"><div><div class="row" style="gap:6px">${codeChip(k.id)}${k.demo ? demoTag() : ''}</div><h2 id="dr-t" style="margin-top:6px">${esc(L(k.name))}</h2><p>${esc(stShort(st))} · ${pLabel(a)}</p></div><button class="icon-btn" data-act="close-ov" aria-label="${tr('إغلاق','Close')}">${icon('x')}</button></div>
    <div class="sheet-b">
      <p class="muted">${esc(L(k.desc))}</p>
      <div class="kvs"><div><small>${tr('القيمة الحالية','Current value')}</small><b>${vText(k, v)}</b></div><div><small>${tr('مستوى الأداء','Performance level')}</small><b>${pill(s)}</b></div><div><small>${tr('اتجاه الأداء الأفضل','Better direction')}</small><b>${L(DIR[dk(k, Lm).dir])}</b></div></div>
      ${scaleBar(k, v, Lm, {lg:true})}
      <div class="callout ${s === 'ok' ? 'info' : {crit:'crit', warn:'warn', na:'na', nolimit:'nl'}[s]}">${icon(STI[s].ic)}<div class="body"><b>${tr('نتيجة التقييم:','Evaluation result:')}</b> ${resText}</div></div>
      <div><div class="lbl" style="margin-bottom:6px">${tr(`الحدود المعتمدة (الإصدار ${N(a.limitsVer)})`,`Approved limits (version ${N(a.limitsVer)})`)}</div>${Lm ? `<dl class="kv"><dt>${tr('المستهدف','Target')}</dt><dd>${limText(k, Lm, 'target')}</dd><dt>${tr('حد التحذير','Warning limit')}</dt><dd>${limText(k, Lm, 'warn')}</dd><dt>${tr('الحد الحرج','Critical limit')}</dt><dd>${limText(k, Lm, 'crit')}</dd></dl>` : `<span style="color:var(--nl)">${tr('لا توجد محددات معتمدة.','No approved limits.')}</span>`}</div>
      <div><div class="lbl" style="margin-bottom:6px">${tr('طريقة الحساب','Calculation')}</div><p class="muted" style="font-size:14px">${esc(L(k.calc))}</p>

      ${rest.length ? `<button class="btn ghost sm" data-act="toggle-all" data-id="${o.id}">${showAll ? tr('إخفاء الإجراءات غير المرتبطة','Hide uncorrelated actions') : tr(`عرض بقية إجراءات المحور (${N(rest.length)}) حسب RII`,`Show the other axis actions (${N(rest.length)}) by RII`)}</button>` : ''}</section>`;
  }).join('');

  const chosen = anyActionSelected(p);

  const banner = !sg.open ? `<div class="done-banner" role="status">${icon('check','lg')}<div class="body"><b>${sg.label}.</b> ${chosen ? tr('أُزيلت المشكلة من قائمة التنبيهات. يبقى التمييز بين «تم اختياره» و«تم تنفيذه» لكل إجراء.','The problem was removed from the alerts list. Each action still shows “chosen” and “implemented” separately.') : tr('اكتُفي بتوثيق العائق دون اختيار إجراء تصحيحي.','The obstacle was recorded without choosing a corrective action.')}</div>
      ${p.obstacleOnly && !chosen ? `<button class="btn ghost sm" data-act="obs-only-undo">${tr('تراجع','Undo')}</button>` : ''}<button class="btn primary sm" data-act="report-for" data-id="${a.id}">${icon('file','sm')}${tr('عرض التقرير','View report')}</button></div>` : '';

  return `<div class="page">
    <div class="ph"><div class="t"><button class="crumb" data-act="go" data-r="results" data-id="${a.id}">${icon('back','sm')}${tr('نتائج','Results:')} ${esc(stShort(st))} · ${pLabel(a)}</button><h1 class="h1">${tr('المشكلة والعوائق والإجراءات','Problem, obstacles & actions')}</h1><p class="lead">${codeChip(p.id)} ${esc(L(k.name))}</p></div></div>
    ${phases(chosen ? 3 : 2, {1:['results', a.id]})}
    ${banner}
    <section class="card"><div class="card-h"><div><h2>${tr('معلومات المشكلة','Problem details')}</h2></div><div class="end">${pill(s)}</div></div>
      <div class="kvs" style="margin-bottom:12px"><div><small>${tr('المحطة','Plant')}</small><b>${esc(stShort(st))}</b></div><div><small>${tr('المؤشر المرتبط','Related indicator')}</small><b>${esc(L(k.name))}</b></div><div><small>${tr('تاريخ الاكتشاف','Detected on')}</small><b>${N(p.detected)}</b></div><div><small>${tr('القيمة المسجلة','Recorded value')}</small><b>${vText(k, p.value)}</b></div><div><small>${tr('الحد المعتمد','Approved limit')}</small><b style="font-size:13.5px">${limText(k, Lm, s === 'crit' ? 'crit' : 'warn')}</b></div></div>
      ${scaleBar(k, p.value, Lm)}
      <div class="field" style="margin-top:12px"><label for="p-desc">${tr('وصف المشكلة','Problem description')}</label><textarea id="p-desc" class="textarea" style="min-height:64px" data-bind="__pdesc:${p.id}" data-lazy="1">${esc(problemDesc(p))}</textarea></div></section>

    <section class="card"><div class="card-h"><div><h2>${tr('العوائق','Obstacles')}</h2><div class="desc">${tr(`حدّد فقط العوائق التي ترتبط بهذه المشكلة، وصنّف كلاً منها: مؤكد أو محتمل. لا يلزم تقييم بقية العوائق. العوائق الأربعون من جدول البحث موزعة على سبعة محاور، ومرتبة داخل كل محور حسب أهميتها.`,`Tick only the obstacles linked to this problem and classify each as confirmed or possible. The others need no assessment. The thesis’s 40 obstacles are grouped into seven axes and ordered by importance within each axis.`)}</div></div></div>
      <div class="row" style="margin-bottom:14px"><div class="input-wrap" style="flex:1;min-width:200px">${icon('search')}<input id="oq" class="input" type="search" placeholder="${tr('ابحث في العوائق بالاسم أو الرمز','Search obstacles by name or code')}" data-bind="oq" value="${esc(S.oq)}" aria-label="${tr('بحث في العوائق','Search obstacles')}"></div>
        <div class="seg"><button class="${!S.oSel ? 'on' : ''}" data-act="osel-filter" data-v="0">${tr(`جميع العوائق (${all.length})`,`All obstacles (${all.length})`)}</button><button class="${S.oSel ? 'on' : ''}" data-act="osel-filter" data-v="1">${tr(`المحددة (${so.length})`,`Selected (${so.length})`)}</button></div></div>
      <div class="ogrid">${pool.length ? rows : emptyState('search', tr('لا توجد عوائق مطابقة','No matching obstacles'), tr('غيّر كلمة البحث أو اعرض جميع العوائق.','Change the search or show all obstacles.'))}</div>
      <div class="callout na" style="margin-top:14px">${icon('plus')}<div class="body"><b>${tr('عائق غير موجود في النظام؟','Obstacle not in the system?')}</b> ${tr('أضفه مع وصفه ومبرراته، وستُعرض لك جميع الإجراءات التصحيحية لتختار منها.','Add it with a description and rationale; all corrective actions will then be shown for you to choose from.')}</div><button class="btn secondary sm" data-act="sheet" data-v="addObstacle" data-id="${p.id}">${tr('إضافة عائق غير مدرج','Add an unlisted obstacle')}</button></div>
    </section>

    <section class="card" id="actions"><div class="card-h"><div><h2>${tr('الإجراءات التصحيحية المقترحة','Suggested corrective actions')}</h2><div class="desc">${tr('لكل عائق محدد: الإجراءات ذات الارتباط المعنوي به وفق نتائج البحث، مرتبة حسب الرتبة، مع قيمة RII ومعامل الارتباط ودرجة الأولوية. العوائق المؤكدة أولاً ثم المحتملة.','For each selected obstacle: the actions significantly correlated with it in the thesis results, in rank order, with RII, correlation and priority. Confirmed obstacles first, then possible.')}</div></div>
      <div class="end"><button class="btn secondary sm" data-act="sheet" data-v="addAction" data-id="${p.id}">${icon('plus','sm')}${tr('إضافة إجراء خاص','Add a custom action')}</button></div></div>
      ${so.length ? `<div class="stack" style="gap:18px">${groups}${customActs}</div>` : (customActs || emptyState('listchecks', tr('حدّد عائقاً واحداً على الأقل','Select at least one obstacle'), tr('تظهر هنا الإجراءات المرتبطة بالعوائق التي تحددها أعلاه، مرتبة حسب الرتبة.','Actions linked to the obstacles you select above appear here, in rank order.')))}
      ${so.length && !chosen && !p.obstacleOnly ? `<div class="callout na" style="margin-top:16px">${icon('info')}<div class="body">${tr('لا يوجد إجراء مناسب؟ أضف إجراءً خاصاً بالحالة، أو اكتفِ بتوثيق العائق وأعدّ التقرير.','No suitable action? Add a case-specific action, or keep the obstacle only and prepare the report.')}</div><button class="btn secondary sm" data-act="obs-only">${tr('الاكتفاء بالعائق وإعداد التقرير','Keep obstacle only & prepare report')}</button></div>` : ''}
    </section>
  </div>`;
}

/* Action log */
function pageActionLog(){
  const rows = [];
  D().problems.forEach(p => { const st = api.station(p.stationId), k = kpi(p.kpiId);
    Object.entries(p.actions).forEach(([aid, s]) => { if (!s.selected && !s.study && !s.impl) return; const x = action(aid); rows.push({p, st, k, name:L(x.name), code:aid, o:s.obs || '—', s}); });
    p.customActions.forEach(x => { if (x.selected || x.study || x.impl) rows.push({p, st, k, name:x.name, code:x.id, o:x.obs || '—', s:x}); }); });
  const stp = s => s.impl ? `<span class="pill s-ok">${icon('check')}${tr('تم تنفيذه','Implemented')} · ${N(s.impl)}</span>` : s.selected ? `<span class="pill s-info">${icon('tick')}${tr('تم اختياره','Chosen')}</span>` : '';
  return `<div class="page"><div class="ph"><div class="t"><div class="eyebrow">${tr('المرحلة الثالثة','Stage 3')}</div><h1 class="h1">${tr('الإجراءات التصحيحية','Corrective actions')}</h1><p class="lead">${tr('سجل القرارات المتخذة على المشكلات: ما اختير، وما نُفّذ فعلاً، وما يتطلب مزيداً من الدراسة.','A log of decisions on problems: what was chosen, what was actually implemented, and what needs further study.')}</p></div></div>
    <section class="card">${rows.length ? `<div class="tbl-wrap"><table class="tbl stackable"><thead><tr><th>${tr('الإجراء','Action')}</th><th>${tr('العائق','Obstacle')}</th><th>${tr('المشكلة','Problem')}</th><th>${tr('المحطة','Plant')}</th><th>${tr('الحالة','Status')}</th></tr></thead><tbody>${rows.map(r => `<tr class="click" data-act="go" data-r="problem" data-id="${r.p.id}" data-anchor="actions" tabindex="0"><td data-l="${tr('الإجراء','Action')}" class="kname">${esc(r.name)}<small>${r.code}</small></td><td data-l="${tr('العائق','Obstacle')}" class="mono n">${r.o}</td><td data-l="${tr('المشكلة','Problem')}">${esc(L(r.k.name))}<div class="faint" style="font-size:12px">${r.p.id}</div></td><td data-l="${tr('المحطة','Plant')}">${esc(stShort(r.st))}</td><td data-l="${tr('الحالة','Status')}"><span class="row" style="gap:6px">${stp(r.s)}${r.s.study ? `<span class="pill s-nolimit">${tr('يتطلب دراسة','Needs study')}</span>` : ''}</span></td></tr>`).join('')}</tbody></table></div>`
      : emptyState('wrench', tr('لم يُختر أي إجراء بعد','No actions chosen yet'), tr('افتح مشكلة، حدّد العوائق المرتبطة بها، ثم اختر الإجراء المناسب من الإجراءات المقترحة.','Open a problem, select its obstacles, then choose a suitable action from the suggestions.'), `<button class="btn tinted" data-act="go" data-r="problems">${tr('عرض المشكلات','View problems')}</button>`)}</section></div>`;
}

function reportPaper(a, type){
  const st = api.station(a.stationId), rows = evalAs(a), c = counts(rows), probs = D().problems.filter(p => p.assessmentId === a.id);
  const hist = api.forStation(st.id, a.months||1).filter(x => endKey(x) <= endKey(a)).slice(type === 'history' ? 0 : -4);
  const missing = rows.filter(r => r.s === 'na');
  const oRows = probs.flatMap(p => selObst(p).map(o => ({p, id:o.id, name:obstName(p, o.id), s:o.status, note:L(o.note), custom:o.custom})));
  const aRows = probs.flatMap(p => [...Object.entries(p.actions).filter(([, s]) => s.selected || s.study).map(([id, s]) => ({p, id, name:L(action(id).name), o:s.obs || '—', s, rk:(() => { const ob = s.obs && obst(s.obs); const c = ob && ob.corr && ob.corr.find(z => z[0] === id); return c ? c : null; })(), rii:action(id).rii})), ...p.customActions.filter(x => x.selected || x.study).map(x => ({p, id:x.id, name:x.name, o:x.obs || '—', s:x}))]);
  const onlyObs = probs.filter(p => p.obstacleOnly && !anyActionSelected(p));
  const devText = rows.filter(r => r.s === 'crit' || r.s === 'warn').map(r => `«${esc(L(r.k.name))}» (${L(STI[r.s].label)})`).join(tr('، ',', '));
  const notes = Object.entries(a.notes).filter(([, v]) => v && v.trim());
  const sec = (n, t, body) => `<section><h2><span class="sn">${n}</span>${t}</h2>${body}</section>`;
  const keyK = rows.find(r => r.s === 'crit') || rows.find(r => r.s === 'warn') || rows[0];

  const chart = lineChart({labels:hist.map(pShortA), series:[{name:L(keyK.k.name), color:'var(--accent)', values:hist.map(x => x.values[keyK.k.id])}], lines:kl, zero:true, h:190, fmt:x => fmtN(x, keyK.k.dec ?? 1), aria:L(keyK.k.name)});

  return `<article class="paper" aria-label="${tr('معاينة التقرير','Report preview')}">
    <div class="rhead"><div class="row" style="gap:8px">${emblem(LOGOS.ministry, 'landmark', L(INFO.ministry))}${emblem(LOGOS.university, 'grad', L(INFO.univ))}</div>
      <div style="flex:1;min-width:220px"><div class="faint" style="font-size:12.5px">${L(INFO.ministry)} · ${L(INFO.univ)} · ${L(INFO.college)}</div><h1 style="margin-top:4px">${type === 'history' ? tr('تقرير التحليل التاريخي لجودة الخدمة','Historical service-quality analysis report') : tr('تقرير تقييم جودة الخدمة','Service-quality assessment report')}</h1><div class="muted" style="font-size:13px">${L(INFO.title)}</div></div>
      <div class="meta">${tr('رقم التقرير','Report no.')}: <span class="n mono">RPT-${a.id.slice(3)}</span><br>${tr('تاريخ الإعداد','Prepared on')}: ${N(today())}<br>${tr('أعدّه','Prepared by')}: ${esc(L(ME().name))}</div></div>
    <p class="watermark">${icon('flask','sm')} ${tr('تقرير مُولَّد من بيانات تجريبية لأغراض العرض — لا يمثل نتائج ميدانية.','Report generated from demo data for presentation — not field results.')}</p>
    ${sec('1', tr('معلومات المحطة','Plant information'), `<table class="tbl"><tbody><tr><th>${tr('اسم المحطة','Plant')}</th><td>${esc(stName(st))}</td><th>${tr('الموقع','Location')}</th><td>${esc(lookup(GOVS, st.gov))} — ${esc(L(st.loc))}</td></tr><tr><th>${tr('مصدر المياه','Water source')}</th><td>${esc(lookup(SOURCES, st.source))}</td><th>${tr('المهندس المسؤول','Engineer in charge')}</th><td>${esc(L(st.engineer) || '—')}</td></tr><tr><th>${tr('الطاقة التصميمية','Design capacity')}</th><td>${N(fmtN(st.design, 0))} ${tr('م³/يوم','m³/day')}</td><th>${tr('الطاقة الفعلية','Actual capacity')}</th><td>${N(fmtN(st.actual, 0))} ${tr('م³/يوم','m³/day')}</td></tr></tbody></table>`)}
    ${sec('2', tr('فترة التقييم','Assessment period'), `<p>${tr(`${pLabel(a)} — ${ptLabel(a.months||1)} (من ${N(a.start)} إلى ${N(a.end)}). أدخل البيانات ${esc(L(a.enteredBy))} بتاريخ ${N(a.enteredAt)}، واعتمدها ${esc(L(a.approvedBy))} بتاريخ ${N(a.approvedAt)}. قُيّمت النتائج بإصدار المحددات ${N(ver)}.`,`${pLabel(a)} — ${ptLabel(a.months||1)} (${N(a.start)} to ${N(a.end)}). Data entered by ${esc(L(a.enteredBy))} on ${N(a.enteredAt)} and approved by ${esc(L(a.approvedBy))} on ${N(a.approvedAt)}. Evaluated with limits version ${N(ver)}.`)}</p>`)}
    ${sec('3', tr('مؤشرات الأداء ونتائجها','Indicators and results'), `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tr('الرمز','Code')}</th><th>${tr('المؤشر','Indicator')}</th><th>${tr('القيمة المسجلة','Recorded value')}</th><th>${tr('مستوى الأداء','Performance level')}</th></tr></thead><tbody>${grpRows(rows, r => `<tr><td class="mono n">${r.k.id}</td><td>${esc(L(r.k.name))}</td><td class="num">${vText(r.k, r.v)}</td><td>${pill(r.s)}</td></tr>`, 4)}</tbody></table></div>
      <p style="margin-top:8px">${tr(`ضمن الحدود: ${N(c.ok)} · تحذير: ${N(c.warn)} · تجاوز حرج: ${N(c.crit)} · بيانات غير كافية: ${N(c.na)} · دون محددات: ${N(c.nolimit)}.`,`Within limits: ${N(c.ok)} · Warning: ${N(c.warn)} · Critical: ${N(c.crit)} · Insufficient data: ${N(c.na)} · No limits: ${N(c.nolimit)}.`)}</p>`)}
    ${sec('4', tr('المقارنة مع المحددات','Comparison with limits'), `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tr('المؤشر','Indicator')}</th><th>${tr('المستهدف','Target')}</th><th>${tr('حد التحذير','Warning')}</th><th>${tr('الحد الحرج','Critical')}</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(L(r.k.name))}</td><td>${limText(r.k, r.L, 'target')}</td><td>${r.L ? limText(r.k, r.L, 'warn') : '—'}</td><td>${r.L ? limText(r.k, r.L, 'crit') : '—'}</td></tr>`).join('')}</tbody></table></div>`)}
    ${sec('5', tr('اتجاهات المؤشرات بين الفترات','Indicator trends across periods'), `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tr('المؤشر','Indicator')}</th>${hist.map(x => `<th>${pShortA(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><td>${esc(L(r.k.name))}</td>${hist.map(x => { const L2 = api.limits(x.limitsVer)[r.k.id] ?? null, v2 = x.values[r.k.id], s2 = x.kpis.includes(r.k.id) ? statusOf(r.k, v2, L2) : 'na'; return `<td class="num" style="color:${s2 === 'crit' ? 'var(--crit)' : s2 === 'warn' ? 'var(--warn)' : 'inherit'};font-weight:${s2 === 'crit' || s2 === 'warn' ? 600 : 400}">${x.kpis.includes(r.k.id) ? N(fmtN(v2, r.k.dec ?? 1)) : '—'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="faint" style="font-size:12.5px;margin:8px 0">${tr(`القيم الملوّنة تجاوزت حد التحذير أو الحد الحرج وفق الإصدار الساري في فترتها. الشكل: اتجاه «${esc(L(keyK.k.name))}».`,`Coloured values passed the warning or critical limit under the version in force for that period. Chart: “${esc(L(keyK.k.name))}”.`)}</p>${chart}`)}
    ${sec('6', tr('المشكلات المكتشفة','Problems found'), probs.length ? `<ul>${probs.map(p => `<li><b>${p.id}</b> — ${esc(problemDesc(p))} <span class="faint">(${problemStage(p).label})</span></li>`).join('')}</ul>` : `<p>${tr('لم تُفتح مشكلات لهذه الفترة.','No problems were opened for this period.')}${devText ? ` ${tr('الانحرافات المسجلة:','Deviations recorded:')} ${devText}.` : ''}</p>`)}
    ${sec('7', tr('العوائق المحددة','Obstacles identified'), oRows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${tr('العائق','Obstacle')}</th><th>${tr('التصنيف','Classification')}</th><th>${tr('الأدلة والملاحظات','Evidence & notes')}</th></tr></thead><tbody>${oRows.map(r => `<tr><td>${r.id} — ${esc(r.name)}${r.custom ? ` <span class="faint">(${tr('مضاف من المستخدم','added by user')})</span>` : ''}</td><td>${L(OST[r.s])}</td><td>${esc(r.note || '—')}</td></tr>`).join('')}</tbody></table></div>` : `<p>${tr('لم تُحدَّد عوائق لهذه الفترة.','No obstacles were identified for this period.')}</p>`)}

function stationErrors(d){

function limitErrors(d){
  if (d.none) return null;
  const v = x => num(d[x]);
  if (d.dir === 'range'){
    const a = v('critMin'), b = v('min'), c = v('max'), e = v('critMax');
    if ([a,b,c,e].some(x => x == null || Number.isNaN(x))) return tr('أكمل الحدود الأربعة بقيم رقمية.','Fill all four limits with numbers.');
    if (!(a < b && b < c && c < e)) return tr('يجب أن تكون القيم بالترتيب: الحرج الأدنى < الأدنى المقبول < الأعلى المقبول < الحرج الأعلى.','Values must be ordered: critical min < acceptable min < acceptable max < critical max.');
    return null;
  }
  const t = v('target'), w = v('warn'), c = v('crit');
  if ([t,w,c].some(x => x == null || Number.isNaN(x))) return tr('أدخل القيمة المستهدفة وحد التحذير والحد الحرج.','Enter the target, warning and critical limits.');
  if (d.dir === 'higher' && !(c < w && w <= t)) return tr('عندما تكون القيمة الأعلى أفضل: الحد الحرج < حد التحذير ≤ القيمة المستهدفة.','When higher is better: critical < warning ≤ target.');
  if (d.dir === 'lower' && !(t <= w && w < c)) return tr('عندما تكون القيمة الأقل أفضل: القيمة المستهدفة ≤ حد التحذير < الحد الحرج.','When lower is better: target ≤ warning < critical.');
  return null;
}
function limitsFromForm(d){

}

    if (t === 'addAction'){ const p = api.problem(id), c = selObst(p).find(o => o.status === 'confirmed') || selObst(p)[0]; S.sheet = {type:t, id, d:{name:'', desc:'', obs:c ? c.id : '', why:'', selected:true}}; }
    renderOverlays();
  },
  'close-ov':() => { S.sheet = null; S.drawer = null; renderOverlays(); render(); },
  'close-ov-bg':(el, e) => { if (e.target !== el) return; S.sheet = null; S.drawer = null; renderOverlays(); render(); },
  'kf-type':el => { S.kf.type = el.dataset.v; render(); },
  'lm-dir':el => { S.sheet.d.dir = el.dataset.v; renderOverlays(); },
  'ao-st':el => { S.sheet.d.status = el.dataset.v; renderOverlays(); },
  'save-station':() => {
    const sh = S.sheet, d = sh.d, e = stationErrors(d); sh.tried = true;
    if (Object.keys(e).length){ renderOverlays(); return; }
    const Dd = D(); let n = Dd.seq.st, id; do { id = 'st-' + (++n); } while (api.station(id)); Dd.seq.st = n;
    const nm = d.name.trim();
    Dd.stations.push({ id, name:nm, short:shortFrom(nm), gov:d.gov, loc:d.loc.trim(), source:d.source, design:num(d.design), actual:num(d.actual) ?? 0, engineer:d.engineer.trim(), notes:d.notes, tracked:allKpis().map(k => k.id) });
    S.sheet = null; S.flash = id; S.stQuery = ''; if (S.route !== 'stations') S.route = 'stations'; render(); toast(tr(`أُضيفت «${esc(nm)}» إلى محطاتك`,`“${esc(nm)}” added to your plants`));
    setTimeout(() => { S.flash = null; }, 1700);
  },
  'kf-method':el => { S.sheet.d.method = el.dataset.v; renderOverlays(); },
  'kf-dir':el => { S.sheet.d.dir = el.dataset.v; renderOverlays(); },
  'save-kpi':() => {
    const sh = S.sheet, d = sh.d; sh.tried = true;
    if (Object.keys(kpiFormErrors(d)).length){ renderOverlays(); return; }
    const Dd = D(); Dd.kpis = Dd.kpis || []; Dd.groups = Dd.groups || [];
    let grp = d.grp;
    if (grp === '__new'){ grp = 'g-' + (++Dd.seq.grp); Dd.groups.push({id:grp, name:d.newGrp.trim()}); }
    const m = d.method, unit = m === 'ratio' ? BI('%','%') : m === 'duration' ? BI('ساعة','h') : d.unit.trim();
    const spec = { grp, method:m, mtype:m === 'direct' ? d.mtype : m === 'ratio' ? 'ratio' : 'duration', dir:d.dir, dec:m === 'direct' && d.mtype === 'count' ? 0 : (m === 'ratio' || m === 'duration' || m === 'avg') ? 1 : 2,
      unit, name:biOr(d.name, d.nameEn), desc:String(d.desc || '').trim() || biOr(d.name, d.nameEn), lbl:String(d.lbl || '').trim() || null,
      num:d.num.trim() || null, den:d.den.trim() || null, iu:d.iu.trim() || tr('وحدة','unit'), cnt:d.cnt.trim() || null, sum:d.sum.trim() || null, cu:'' };
    if (sh.id){ const i = Dd.kpis.findIndex(x => x.id === sh.id); Dd.kpis[i] = Object.assign({id:sh.id}, spec); S.sheet = null; render(); toast(tr('حُفظت تعديلات المؤشر','Indicator updated')); return; }
    let n = Dd.seq.kpi, id; do { id = 'U-' + String(++n).padStart(2, '0'); } while (Dd.kpis.some(x => x.id === id)); Dd.seq.kpi = n;
    Dd.kpis.push(Object.assign({id}, spec));
    if (d.adopt) Dd.stations.forEach(st => { if (!st.tracked.includes(id)) st.tracked.push(id); });
    S.kf.type = 'all'; S.sheet = null; render(); toast(tr(`أُضيف المؤشر ${id} — اضبط محدداته من «تعديل المحددات»`,`Indicator ${id} added — set its limits from “Edit limits”`));
  },
  'delete-kpi':() => { const id = S.sheet.id, Dd = D(); Dd.kpis = Dd.kpis.filter(x => x.id !== id); Dd.stations.forEach(st => { st.tracked = st.tracked.filter(x => x !== id); }); Dd.limitVersions.forEach(v => { delete v.limits[id]; }); S.sheet = null; render(); toast(tr(`حُذف المؤشر ${id}`,`Indicator ${id} deleted`)); },
  'ax-toggle':el => { const k = el.dataset.k; S.axOpen[k] = el.getAttribute('aria-expanded') !== 'true'; render(); },
  'save-limits':() => {
    const sh = S.sheet, d = sh.d, k = kpi(sh.id); sh.tried = true;
    if (limitErrors(d)){ renderOverlays(); return; }
    let cur = api.currentVer();
    if (S.limitVerSession !== cur.ver || D().assessments.some(a => a.limitsVer === cur.ver)){
      const nv = (Math.round((parseFloat(cur.ver) + 0.1)*10)/10).toFixed(1);
      cur = {ver:nv, from:today(), by:ADMIN(), note:BI('',''), limits:clone(cur.limits)}; D().limitVersions.push(cur); S.limitVerSession = nv;
    }
    cur.limits[k.id] = limitsFromForm(d);
    cur.note = BI([cur.note.ar, `تعديل محددات ${k.id}`].filter(Boolean).join('؛ '), [cur.note.en, `${k.id} limits edited`].filter(Boolean).join('; '));
    S.sheet = null; render(); toast(tr(`حُفظت المحددات في الإصدار ${cur.ver} — تُطبَّق على التقييمات الجديدة فقط`,`Limits saved as version ${cur.ver} — they apply to new assessments only`));
  },
  'save-obstacle':() => {
    const sh = S.sheet, d = sh.d, p = api.problem(sh.id); sh.tried = true;
    if (!d.name.trim() || !d.why.trim()){ renderOverlays(); return; }
    const id = 'X-' + String(p.custom.length + 1).padStart(2, '0');
    p.custom.push({id, name:d.name.trim(), desc:d.desc.trim() || tr('عائق أضافه المستخدم لهذه المشكلة.','Obstacle added by the user for this problem.'), why:d.why.trim()});
    p.obstacles[id] = {status:d.status, note:d.why.trim()};
    pAudit(p, BI(`إضافة عائق غير مدرج ${id} (${OST[d.status].ar})`,`Unlisted obstacle ${id} added (${OST[d.status].en})`));
    S.sheet = null; render(); const el = document.getElementById('actions'); if (el) el.scrollIntoView({block:'start'});
    toast(tr('أُضيف العائق؛ تُعرض الآن جميع الإجراءات التصحيحية','Obstacle added; all corrective actions are now shown'));
  },
  'save-action':() => {
    const sh = S.sheet, d = sh.d, p = api.problem(sh.id); sh.tried = true;
    if (!d.name.trim()){ renderOverlays(); return; }
    const id = 'C-' + String(p.customActions.length + 1).padStart(2, '0');
    p.customActions.push({id, name:d.name.trim(), desc:d.desc.trim(), obs:d.obs, why:d.why.trim(), selected:d.selected, study:false, impl:null});
    if (d.selected) p.obstacleOnly = false;
    pAudit(p, BI(`إضافة إجراء خاص بالحالة ${id}${d.selected ? ' واختياره' : ''}`,`Case-specific action ${id} added${d.selected ? ' and chosen' : ''}`));
    S.sheet = null; render(); toast(d.selected ? tr('أُضيف الإجراء واختير؛ تمت معالجة المشكلة','Action added and chosen; the problem is treated') : tr('أُضيف الإجراء الخاص بالحالة','Case-specific action added'));
  },
  wstep:el => { S.wizard.step = +el.dataset.v; render(); window.scrollTo(0, 0); },
  wprev:() => { S.wizard.step--; render(); window.scrollTo(0, 0); },
  wnext:() => { const w = S.wizard; if (w.step === 2 && !w.filled){ w.inputs = sampleInputs(api.station(w.stationId)); w.filled = true; } w.step++; render(); window.scrollTo(0, 0); },
  wfill:() => { S.wizard.inputs = sampleInputs(api.station(S.wizard.stationId)); render(); },
  wclear:() => { S.wizard.inputs = {}; S.wizard.ack = false; render(); },
  'wpick-all':() => { S.wizard.selected = api.station(S.wizard.stationId).tracked.slice(); render(); },
  'wpick-none':() => { S.wizard.selected = []; render(); },
  wdraft:saveDraft, wapprove:approve,
  drawer:el => { S.drawer = {id:el.dataset.id, k:el.dataset.k}; renderOverlays(); },
  'open-problem':el => { const a = api.assessment(el.dataset.id), pid = createProblem(a, el.dataset.k, 'manual'); toast(tr(`فُتحت المشكلة ${pid}`,`Problem ${pid} opened`)); go('problem', {id:pid}); },
  oset:el => { const p = api.problem(S.params.id), id = el.dataset.id, v = el.dataset.v; if (p.obstacles[id].status === v) return; p.obstacles[id].status = v; pAudit(p, BI(`تصنيف العائق ${id}: ${OST[v].ar}`,`Obstacle ${id} classified: ${OST[v].en}`)); render(); },
  'osel-filter':el => { S.oSel = el.dataset.v === '1'; render(); },
  'toggle-all':el => { const k = S.params.id + el.dataset.id; S.showAll[k] = !S.showAll[k]; render(); },
  'obs-only':() => { const p = api.problem(S.params.id); p.obstacleOnly = true; pAudit(p, BI('الاكتفاء بتوثيق العائق دون إجراء تصحيحي','Obstacle recorded without a corrective action')); const a = api.assessment(p.assessmentId); S.rep = {station:a.stationId, asId:a.id, type:'period'}; go('reports'); toast(tr('وُثّق العائق وأُزيلت المشكلة من التنبيهات','Obstacle recorded; the problem left the alerts list')); },
  'obs-only-undo':() => { const p = api.problem(S.params.id); p.obstacleOnly = false; pAudit(p, BI('التراجع عن الاكتفاء بالعائق','Reverted “obstacle only”')); render(); },
  astudy:el => { const p = api.problem(S.params.id), r = actRef(p, el.dataset.id, el.dataset.c); r.study = !r.study; pAudit(p, BI(`${r.study ? 'تحديد' : 'إلغاء'} «يتطلب مزيداً من الدراسة» للإجراء ${el.dataset.id}`,`${r.study ? 'Marked' : 'Unmarked'} “needs further study” on ${el.dataset.id}`)); render(); },
  aimpl:el => { S.implFor = S.params.id + el.dataset.id; render(); },
  'aimpl-cancel':() => { S.implFor = null; render(); },
  'aimpl-save':el => { const p = api.problem(S.params.id), r = actRef(p, el.dataset.id, el.dataset.c), dt = (document.getElementById('impl-d') || {}).value || today(); r.impl = dt; S.implFor = null; pAudit(p, BI(`تسجيل تنفيذ الإجراء ${el.dataset.id} بتاريخ ${dt}`,`Implementation of ${el.dataset.id} recorded on ${dt}`)); render(); toast(tr('سُجّل تنفيذ الإجراء','Implementation recorded')); },
  aunimpl:el => { const p = api.problem(S.params.id), r = actRef(p, el.dataset.id, el.dataset.c); r.impl = null; pAudit(p, BI(`التراجع عن تسجيل تنفيذ ${el.dataset.id}`,`Implementation of ${el.dataset.id} undone`)); render(); },
  'report-for':el => { const a = api.assessment(el.dataset.id); S.rep = {station:a.stationId, asId:a.id, type:'period'}; go('reports'); },
  'download-report':() => { downloadReport(); }
};
const CHANGE = {
  track:el => { const st = api.station(S.kf.station), id = el.dataset.id; st.tracked = el.checked ? [...new Set(st.tracked.concat(id))] : st.tracked.filter(x => x !== id); render(); toast(el.checked ? tr(`اعتُمد ${id} في ${esc(stShort(st))}`,`${id} adopted at ${esc(stShort(st))}`) : tr(`أُلغي اعتماد ${id} في ${esc(stShort(st))}`,`${id} no longer adopted at ${esc(stShort(st))}`)); },
  wpick:el => { const w = S.wizard, id = el.dataset.id; w.selected = el.checked ? allKpis().map(k => k.id).filter(k => k === id || w.selected.includes(k)) : w.selected.filter(x => x !== id); render(); },
  wgroup:el => { const w = S.wizard, st = api.station(w.stationId), ids = allKpis().filter(k => k.grp === el.dataset.g && st.tracked.includes(k.id)).map(k => k.id); const on = el.dataset.ind === '1' || el.checked; w.selected = on ? allKpis().map(k => k.id).filter(k => ids.includes(k) || w.selected.includes(k)) : w.selected.filter(x => !ids.includes(x)); render(); },
  wack:el => { S.wizard.ack = el.checked; render(); },
  osel:el => { const p = api.problem(S.params.id), id = el.dataset.id;
    if (el.checked){ p.obstacles[id] = {status:'confirmed', note:(p.obstacles[id] && p.obstacles[id].note) || ''}; pAudit(p, BI(`تحديد العائق ${id} (مؤكد)`,`Obstacle ${id} selected (confirmed)`)); }
    else { delete p.obstacles[id]; pAudit(p, BI(`إلغاء تحديد العائق ${id}`,`Obstacle ${id} deselected`)); }
    render(); },
  aselect:el => { const p = api.problem(S.params.id), wasOpen = problemStage(p).open, r = actRef(p, el.dataset.id, el.dataset.c);
    r.selected = el.checked; if (el.dataset.o) r.obs = el.dataset.o; if (!el.checked) r.impl = null; if (el.checked) p.obstacleOnly = false;
    pAudit(p, BI(`${el.checked ? 'اختيار' : 'إلغاء اختيار'} الإجراء ${el.dataset.id}`,`Action ${el.dataset.id} ${el.checked ? 'chosen' : 'unchosen'}`)); render();
    if (wasOpen && !problemStage(p).open) toast(tr('اختير الإجراء — تمت معالجة المشكلة وأُزيلت من التنبيهات','Action chosen — the problem is treated and left the alerts list')); },
  'lm-none':el => { S.sheet.d.none = el.checked; renderOverlays(); },
  'kf-adopt':el => { S.sheet.d.adopt = el.checked; },
  'aa-sel':el => { S.sheet.d.selected = el.checked; }
};

/* =========================================================
   EVENTS
   ========================================================= */
function setBind(path, val){
  if (path === '__note'){ const d = S.drawer; api.assessment(d.id).notes[d.k] = val; return; }
  if (path.startsWith('__onote:')){ const [, pid, oid] = path.split(':'), p = api.problem(pid); if (p.obstacles[oid]) p.obstacles[oid].note = val; return; }
  if (path.startsWith('__pdesc:')){ api.problem(path.split(':')[1]).desc = val; return; }
  const parts = path.split('.'); let o = S;
  for (let i = 0; i < parts.length - 1; i++){ if (o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = val;
}
function afterBind(el){
  const h = el.dataset.hook, path = el.dataset.bind;
  if (h === 'wst'){ const w = S.wizard, st = api.station(w.stationId); w.selected = st.tracked.slice(); w.inputs = {}; w.filled = false; w.ack = false; }
  if (h === 'wperiod') setPeriodDates(S.wizard);
  if (path === 'rep.station') S.rep.asId = null;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio') return;
  setBind(el.dataset.bind, el.value);
  if (!el.dataset.lazy){ if (el.closest('#ov')) renderOverlays(); else render(); } else saveStore();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.actChange){ const fn = CHANGE[el.dataset.actChange]; if (fn) fn(el, e); return; }
  if (el.dataset && el.dataset.bind && el.tagName === 'SELECT'){ setBind(el.dataset.bind, el.dataset.num ? Number(el.value) : el.value); afterBind(el); if (el.closest('#ov')) renderOverlays(); else render(); }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const A = S.auth;
  if (f.dataset.form === 'login'){
    A.email = document.getElementById('lg-email').value.trim(); A.pass = document.getElementById('lg-pass').value;
    if (!A.email || !A.pass){ A.err = tr('أدخل البريد الإلكتروني وكلمة المرور للمتابعة.','Enter your email and password to continue.'); render(); return; }
    const acc = store.accounts.find(a => a.email.toLowerCase() === A.email.toLowerCase());
    if (!acc || acc.pass !== hashPw(A.pass)){ A.err = tr('البريد الإلكتروني أو كلمة المرور غير صحيحة. تحقّق منهما وحاول مجدداً.','The email or password is incorrect. Check them and try again.'); A.pass = ''; render(); document.getElementById('lg-pass').focus(); return; }
    signIn(acc.id);
  }
  if (f.dataset.form === 'signup'){
    ['name','job','email','pass','pass2'].forEach(k => { const el = document.getElementById('su-' + k); if (el) A.su[k] = el.value; });
    A.suTried = true;
    if (Object.keys(signupErrors(A.su)).length){ render(); const bad = document.querySelector('.auth-card .input.bad'); if (bad) bad.focus(); return; }
    const id = 'u-' + Date.now().toString(36), name = A.su.name.trim();
    store.accounts.push({id, name, email:A.su.email.trim(), pass:hashPw(A.su.pass), job:A.su.job.trim()});
    store.data[id] = seedEmpty(name);
    signIn(id); toast(tr(`أهلاً ${esc(name)} — أُنشئ حسابك. ابدأ بإضافة محطتك الأولى.`,`Welcome, ${esc(name)} — your account is ready. Start by adding your first plant.`));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S.sheet || S.drawer){ S.sheet = null; S.drawer = null; renderOverlays(); render(); } else if (S.navOpen){ S.navOpen = false; render(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act], div[data-act][tabindex]')){ e.preventDefault(); e.target.click(); }
});

render();
</script>
