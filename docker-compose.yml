# Local services: PostgreSQL 16 and Mailpit (catches all outgoing email).
# Start with `npm run db:up`. Mailpit inbox: http://localhost:54326
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # The superuser is used only by scripts/db-roles.ts (first step of `npm run db:migrate`),
      # which creates the application database and its three roles.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      POSTGRES_DB: postgres
    ports:
      - "${DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d postgres -c 'select 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-54325}:1025"
      - "${MAILPIT_UI_PORT:-54326}:8025"

  # Headless Chromium that turns the report HTML into a PDF. The app posts HTML to it
  # (GOTENBERG_URL) and streams the PDF back; nothing else talks to it. It makes no
  # outbound requests for our reports: the HTML is self-contained (fonts inlined).
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      # No network, and no local files outside Gotenberg's own working folder.
      - "--chromium-deny-list=^(https?|ftp)://.*|^file:(?!//\\/tmp/).*"
      - "--api-timeout=60s"
    ports:
      - "127.0.0.1:${PDF_PORT:-54327}:3000"

volumes:
  pgdata:
