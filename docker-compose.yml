# Local services: PostgreSQL 16 and Mailpit (catches all outgoing email).
# Start with `npm run db:up`. Mailpit inbox: http://localhost:54326
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # The superuser is used only by docker/initdb to create the two roles below.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-wtp_sqms}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-wtp_owner_dev}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wtp_app_dev}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-wtp_auth_dev}
    ports:
      - "${DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d $${APP_DB_NAME} -c 'select 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-54325}:1025"
      - "${MAILPIT_UI_PORT:-54326}:8025"

volumes:
  pgdata:
