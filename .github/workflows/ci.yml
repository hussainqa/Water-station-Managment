name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Same Postgres + roles as local development (docker/initdb creates them).
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:db
      - run: npm run build
